<style>

    --surface-2: #F3EFE7;
    --ink: #231F1C;
    --muted: #6B655D;
    --line: #E4DED4;
    --accent: #B23A2E;
    --accent-ink: #FFFFFF;
    --accent-wash: rgba(178,58,46,0.08);
    --good: #3F7A4E;
    --shadow: 0 1px 2px rgba(35,31,28,0.04);

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    --bg: #151313;
    --surface: #1F1D1B;
    --surface-2: #26231F;
    --ink: #F2EEE8;
    --muted: #9C948A;
    --line: #332F2B;
    --accent: #D9503F;
    --accent-ink: #1A1110;
    --accent-wash: rgba(217,80,63,0.14);
    --good: #6FBF7F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151313;
      --surface: #1F1D1B;
      --surface-2: #26231F;
      --ink: #F2EEE8;
      --muted: #9C948A;
      --line: #332F2B;
      --accent: #D9503F;
      --accent-ink: #1A1110;
      --accent-wash: rgba(217,80,63,0.14);
      --good: #6FBF7F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);

  .shell { display: flex; min-height: 100%; max-width: 1200px; margin: 0 auto; }

  /* ---- top bar ---- */

  .brand-name { font-size: 21px; line-height: 1.1; white-space: nowrap; }
  .brand-sub { color: var(--muted); font-size: 11px; margin-top: 1px; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .theme-toggle {

    width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--muted); }
  .theme-toggle svg { width: 17px; height: 17px; }

  .view-toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .view-toggle button {

    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .view-toggle button + button { border-left: 1px solid var(--line); }
  .view-toggle button.active { background: var(--accent-wash); color: var(--accent); }
  .view-toggle svg { width: 16px; height: 16px; }

  /* ---- category rail (mobile) ---- */
  .rail-wrap {
    background: var(--bg); border-bottom: 1px solid var(--line);
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 65px); z-index: 39;

  .rail-chip {

    font-size: 13px; font-weight: 600; padding: 8px 13px; border-radius: 20px; cursor: pointer; white-space: nowrap;

  /* ---- sidebar (desktop) ---- */

  .sidebar-item {

  .sidebar-count { color: var(--muted); font-size: 12px; font-weight: 400; }

  .main-col { flex: 1; min-width: 0; }
  .page { padding: 20px 16px 150px; }

  .search-row { position: relative; margin-bottom: 20px; }
  .search-input {

  .search-input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 30px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .section-head:first-child { margin-top: 0; }
  .section-title { font-size: 19px; font-weight: 700; margin: 0; }
  .section-count { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

  /* ---- grid view ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; gap: 7px; position: relative;
    box-shadow: var(--shadow);
  }
  .card.checked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card-img-wrap { position: relative; }
  .card-img {
    width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover;
    background: var(--surface-2); display: block;

  .card-select-dot {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.9); background: rgba(35,31,28,0.35);
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff;

  .card-select-dot.on { background: var(--accent); border-color: var(--accent); }
  .card-select-dot svg { width: 14px; height: 14px; opacity: 0; }

  .card-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }

  .card-price { font-weight: 700; font-size: 14.5px; white-space: nowrap; }

  .rate-row:last-child { border-bottom: none; }
  .rate-thumb { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .rate-mid { flex: 1; min-width: 0; }
  .rate-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .rate-unit { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .rate-price-block { text-align: right; flex-shrink: 0; min-width: 62px; }
  .rate-price { font-weight: 700; font-size: 14.5px; }
  .rate-action { flex-shrink: 0; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .serif { font-size: 20px; color: var(--ink); margin-bottom: 6px; }

  /* ---- checkout bar ---- */
  .checkout-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .checkout-inner {
    max-width: 1200px; margin: 0 auto; margin-left: auto; margin-right: auto;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.14); pointer-events: auto;
  }
  :root[data-theme="dark"] .checkout-inner { box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  @media (min-width: 860px) {
    .checkout-inner { max-width: 700px; }
  }
  .checkout-meta { min-width: 0; }
  .checkout-count { font-size: 12px; color: var(--muted); }
  .checkout-total { font-size: 19px; font-weight: 800; }
  .checkout-btn {
    background: var(--accent); color: var(--accent-ink); border: none;
    font-weight: 700; font-size: 14px; padding: 12px 18px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap;
  }
  .checkout-btn:hover { filter: brightness(1.06); }
  .checkout-btn svg { width: 17px; height: 17px; }
  .checkout-view-link {
    background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline;
    cursor: pointer; padding: 0; margin-top: 2px;
  }

  /* ---- review sheet ---- */
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(20,17,15,0.45); z-index: 90;
    display: flex; align-items: flex-end; justify-content: center;
  }
  @media (min-width: 640px) { .sheet-overlay { align-items: center; } }
  .sheet {
    background: var(--bg); border: 1px solid var(--line); width: 100%; max-width: 460px;
    border-radius: 16px 16px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto;
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));

  @media (min-width: 640px) { .sheet { border-radius: 16px; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-title { font-size: 18px; font-weight: 700; margin: 0; }
  .sheet-close { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; }
  .sheet-close svg { width: 20px; height: 20px; }
  .sheet-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sheet-row-name { flex: 1; font-size: 13.5px; font-weight: 600; }
  .sheet-row-unit { color: var(--muted); font-size: 11.5px; }
  .sheet-row-total { font-weight: 700; font-size: 13.5px; min-width: 66px; text-align: right; }
  .sheet-remove { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; }
  .sheet-remove svg { width: 15px; height: 15px; }
  .sheet-total-row { display: flex; justify-content: space-between; padding-top: 14px; font-weight: 800; font-size: 16px; }

  .admin-page { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  .admin-title { font-size: 24px; margin: 0 0 4px; font-weight: 700; }
  .admin-sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }

  .name-cell { display: flex; align-items: center; gap: 10px; }
  .row-actions { display: flex; gap: 6px; }
  .price-cell { font-weight: 700; }
  .cat-badge { background: var(--surface-2); color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 6px; display: inline-block; }

  select.plain-select {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    padding: 9px 12px; border-radius: 9px; font-size: 13px;
  }

  /* ---- modal ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,17,15,0.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal {
    background: var(--bg); border: 1px solid var(--line); width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 22px; max-height: 90vh; overflow-y: auto;
    padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));

  @media (min-width: 640px) { .modal { border-radius: 16px; } }
  .modal-title { font-size: 18px; margin: 0 0 18px; font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .modal-error { background: var(--accent-wash); border: 1px solid var(--accent); color: var(--accent); font-size: 12.5px; padding: 9px 11px; border-radius: 9px; margin-bottom: 14px; }

  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 260px; margin: 0 auto; }
  .pin-key {

  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);

  .admin-empty { text-align: center; padding: 50px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>

function safeGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch (e) { console.error("Storage write failed", e); return false; }
}

function loadProducts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULT_PRODUCTS;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    return DEFAULT_PRODUCTS;
  } catch (e) {
    console.error("Failed to load products, using defaults", e);
    return DEFAULT_PRODUCTS;
  }
}
function saveProducts(products) { return safeSet(STORAGE_KEY, JSON.stringify(products)); }
function loadWhatsAppNumber() { return safeGet(WHATSAPP_NUMBER_KEY, DEFAULT_WHATSAPP_NUMBER); }
function saveWhatsAppNumber(num) { return safeSet(WHATSAPP_NUMBER_KEY, num); }
function loadPin() { return safeGet(ADMIN_PIN_KEY, DEFAULT_PIN); }
function savePin(pin) { return safeSet(ADMIN_PIN_KEY, pin); }

function formatRupees(n) { return "₹" + Number(n).toLocaleString("en-IN"); }
function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ================= theme ================= */

function useTheme() {
  const [theme, setTheme] = useState(() => safeGet(THEME_KEY, "system"));

  useEffect(() => {
    const root = document.documentElement;
    if (theme === "system") {
      root.removeAttribute("data-theme");
    } else {
      root.setAttribute("data-theme", theme);
    }
    safeSet(THEME_KEY, theme);
  }, [theme]);

  const cycleTheme = useCallback(() => {
    setTheme(prev => (prev === "system" ? "light" : prev === "light" ? "dark" : "system"));
  }, []);

  return [theme, cycleTheme];
}

function Storefront({ products, theme, onCycleTheme, onOpenAdminGate }) {
  const [selected, setSelected] = useState({});
  const [activeCategory, setActiveCategory] = useState("All");
  const [query, setQuery] = useState("");
  const [view, setView] = useState("grid"); // grid | list
  const [showReview, setShowReview] = useState(false);
  const brandTapCount = useRef(0);
  const brandTapTimer = useRef(null);

  const categories = useMemo(() => {
    const set = [];
    products.forEach(p => { if (!set.includes(p.category)) set.push(p.category); });
    return set;
  }, [products]);

  const filtered = useMemo(() => {
    return products.filter(p => {
      const matchesCat = activeCategory === "All" || p.category === activeCategory;
      const matchesQuery = query.trim() === "" || p.name.toLowerCase().includes(query.trim().toLowerCase());
      return matchesCat && matchesQuery;
    });
  }, [products, activeCategory, query]);

  const grouped = useMemo(() => {
    const map = {};
    filtered.forEach(p => {
      if (!map[p.category]) map[p.category] = [];
      map[p.category].push(p);
    });
    return map;
  }, [filtered]);

  function toggle(id) {
    setSelected(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = 1;
      return next;
    });
  }
  function setQty(id, qty) {
    setSelected(prev => {
      const next = { ...prev };
      if (qty <= 0) delete next[id]; else next[id] = Math.min(qty, 99);
      return next;
    });
  }

  const selectedItems = useMemo(() => {
    return Object.entries(selected).map(([id, qty]) => {
      const product = products.find(p => p.id === id);
      return product ? { ...product, qty } : null;
    }).filter(Boolean);
  }, [selected, products]);

  const itemCount = selectedItems.reduce((s, i) => s + i.qty, 0);
  const total = selectedItems.reduce((s, i) => s + i.qty * i.price, 0);

  function handleCheckout() {
    if (selectedItems.length === 0) return;
    const number = loadWhatsAppNumber();
    const lines = selectedItems.map((i, idx) => `${idx + 1}. ${i.name} x${i.qty} — ${formatRupees(i.price * i.qty)}`);
    const message = "Hi! I'd like to order the following crackers:\n\n" + lines.join("\n") + `\n\nTotal: ${formatRupees(total)}\n\nPlease confirm availability. Thank you!`;
    const url = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank", "noopener,noreferrer");
  }

  function scrollToCategory(cat) {
    setActiveCategory(cat);
    if (cat === "All") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    const el = document.getElementById("cat-" + cat.replace(/\s+/g, "-"));
    if (el) {
      const y = el.getBoundingClientRect().top + window.pageYOffset - 130;
      window.scrollTo({ top: y, behavior: "smooth" });
    }
  }

  function handleBrandTap() {
    brandTapCount.current += 1;
    if (brandTapTimer.current) clearTimeout(brandTapTimer.current);
    brandTapTimer.current = setTimeout(() => { brandTapCount.current = 0; }, 1500);
    if (brandTapCount.current >= 5) {
      brandTapCount.current = 0;
      onOpenAdminGate();
    }
  }

  const ItemComp = view === "grid" ? GridCard : RateRow;
  const itemWrap = view === "grid" ? "grid" : "rate-list";

  return (
    <div>
      <header className="topbar">
        <div className="topbar-row">
          <button type="button" className="brand-btn" onClick={handleBrandTap} aria-label="Thadaladi Crackers">
            <span className="brand-name serif">Thadaladi Crackers</span>
            <span className="brand-sub">Wholesale &amp; retail · Since 1998</span>
          </button>
          <div className="topbar-actions">
            <div className="view-toggle" role="group" aria-label="Layout">
              <button type="button" className={view === "grid" ? "active" : ""} aria-pressed={view === "grid"} aria-label="Grid view" onClick={() => setView("grid")}><GridIcon /></button>
              <button type="button" className={view === "list" ? "active" : ""} aria-pressed={view === "list"} aria-label="List view" onClick={() => setView("list")}><ListIcon /></button>
            </div>
            <ThemeToggle theme={theme} onCycle={onCycleTheme} />
          </div>
        </div>
      </header>

      <div className="rail-wrap">
        <div className="rail">
          <button type="button" className={"rail-chip" + (activeCategory === "All" ? " active" : "")} onClick={() => scrollToCategory("All")}>All</button>
          {categories.map(cat => (
            <button key={cat} type="button" className={"rail-chip" + (activeCategory === cat ? " active" : "")} onClick={() => scrollToCategory(cat)}>{cat}</button>
          ))}
        </div>
      </div>

      <div className="shell">
        <aside className="sidebar">
          <div className="sidebar-label">Categories</div>
          <button type="button" className={"sidebar-item" + (activeCategory === "All" ? " active" : "")} onClick={() => scrollToCategory("All")}>
            <span>All crackers</span><span className="sidebar-count">{products.length}</span>
          </button>
          {categories.map(cat => (
            <button key={cat} type="button" className={"sidebar-item" + (activeCategory === cat ? " active" : "")} onClick={() => scrollToCategory(cat)}>
              <span>{cat}</span><span className="sidebar-count">{products.filter(p => p.category === cat).length}</span>
            </button>
          ))}
        </aside>

        <div className="main-col">
          <main className="page">
            <div className="search-row">
              <span className="search-icon"><SearchIcon /></span>
              <input type="text" className="search-input" placeholder="Search crackers by name…" value={query} onChange={(e) => setQuery(e.target.value)} aria-label="Search crackers" />
            </div>

            {Object.keys(grouped).length === 0 ? (
              <div className="empty-state">
                <div className="serif">No crackers found</div>
                <div>Try a different search term or category.</div>
              </div>
            ) : (
              Object.entries(grouped).map(([cat, items]) => (
                <section key={cat} id={"cat-" + cat.replace(/\s+/g, "-")}>
                  <div className="section-head">
                    <h2 className="section-title">{cat}</h2>
                    <span className="section-count">{items.length} item{items.length !== 1 ? "s" : ""}</span>
                  </div>
                  <div className={itemWrap}>
                    {items.map(product => (
                      <ItemComp key={product.id} product={product} qty={selected[product.id] || 0} onToggle={toggle} onQtyChange={setQty} />
                    ))}
                  </div>
                </section>
              ))
            )}
          </main>
        </div>
      </div>

      {itemCount > 0 && (
        <div className="checkout-bar">
          <div className="checkout-inner">
            <div className="checkout-meta">
              <div className="checkout-count">{itemCount} item{itemCount !== 1 ? "s" : ""} selected</div>
              <div className="checkout-total">{formatRupees(total)}</div>
              <button type="button" className="checkout-view-link" onClick={() => setShowReview(true)}>Review order</button>
            </div>
            <button type="button" className="checkout-btn" onClick={handleCheckout}>
              <WhatsAppIcon /> Proceed on WhatsApp
            </button>
          </div>
        </div>
      )}

      {showReview && (
        <ReviewSheet
          items={selectedItems}
          total={total}
          onRemove={(id) => setQty(id, 0)}
          onQtyChange={setQty}
          onClose={() => setShowReview(false)}
          onCheckout={() => { setShowReview(false); handleCheckout(); }}
        />
      )}
    </div>
  );
}

/* ================= admin gate (PIN) ================= */

function PinGate({ onSuccess, onCancel }) {
  const [entered, setEntered] = useState("");
  const [error, setError] = useState(false);
  const pinLength = 4;

  function press(digit) {
    if (entered.length >= pinLength) return;
    const next = entered + digit;
    setEntered(next);
    setError(false);
    if (next.length === pinLength) {
      const correct = loadPin();
      setTimeout(() => {
        if (next === correct) {
          onSuccess();
        } else {
          setError(true);
          setEntered("");
        }
      }, 120);
    }
  }
  function backspace() { setEntered(prev => prev.slice(0, -1)); setError(false); }

  useEffect(() => {
    function handleKey(e) {
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === "Backspace") backspace();
      else if (e.key === "Escape") onCancel();
    }
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  });

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pin-title" onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="confirm-box">
        <h2 id="pin-title" className="modal-title">Enter admin PIN</h2>
        <p style={{ marginBottom: 0 }}>This area is for the shop owner only.</p>
        <div className="pin-dots" aria-live="polite">
          {Array.from({ length: pinLength }).map((_, i) => (
            <span key={i} className={"pin-dot" + (i < entered.length ? " filled" : "")} />
          ))}
        </div>
        {error && <div className="modal-error" style={{ textAlign: "center" }}>Incorrect PIN. Try again.</div>}
        <div className="pin-pad">
          {[1,2,3,4,5,6,7,8,9].map(n => (
            <button key={n} type="button" className="pin-key" onClick={() => press(String(n))}>{n}</button>
          ))}
          <button type="button" className="pin-key" onClick={onCancel} style={{ color: "var(--muted)", fontSize: "13px" }}>Cancel</button>
          <button type="button" className="pin-key" onClick={() => press("0")}>0</button>
          <button type="button" className="pin-key" onClick={backspace} aria-label="Backspace" style={{ fontSize: "13px" }}>⌫</button>
        </div>
      </div>
    </div>
  );
}

const BLANK_FORM = { name: "", category: "", unit: "", price: "", mrp: "", img: "" };

function ProductFormModal({ initial, categories, onCancel, onSave }) {
  const [form, setForm] = useState(initial ? { ...BLANK_FORM, ...initial, mrp: initial.mrp || "" } : BLANK_FORM);
  const [error, setError] = useState("");
  const [useNewCategory, setUseNewCategory] = useState(initial ? !categories.includes(initial.category) : categories.length === 0);
  const firstFieldRef = useRef(null);

  useEffect(() => { if (firstFieldRef.current) firstFieldRef.current.focus(); }, []);

  function update(field, value) { setForm(prev => ({ ...prev, [field]: value })); }

  function handleSubmit(e) {
    e.preventDefault();
    const name = form.name.trim();
    const category = form.category.trim();
    const unit = form.unit.trim();
    const priceNum = parseFloat(form.price);
    const mrpNum = form.mrp === "" ? null : parseFloat(form.mrp);

    if (!name) { setError("Enter a product name."); return; }
    if (!category) { setError("Enter or choose a category."); return; }
    if (!unit) { setError("Enter a unit, like 'box of 10'."); return; }
    if (isNaN(priceNum) || priceNum <= 0) { setError("Enter a price greater than 0."); return; }
    if (mrpNum !== null && (isNaN(mrpNum) || mrpNum <= priceNum)) { setError("MRP must be greater than the price, or left blank."); return; }

    onSave({
      id: initial && initial.id ? initial.id : uid(),
      name, category, unit, price: priceNum, mrp: mrpNum,
      img: form.img.trim() || "https://images.unsplash.com/photo-1533230050512-dc65cca0a921?w=300&q=60",
    });
  }

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pf-title">
      <div className="modal">
        <h2 id="pf-title" className="modal-title">{initial ? "Edit product" : "Add product"}</h2>
        {error && <div className="modal-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="pf-name">Product name</label>
            <input id="pf-name" ref={firstFieldRef} type="text" value={form.name} onChange={(e) => update("name", e.target.value)} placeholder="e.g. Wire Sparklers — 10 inch" />
          </div>

          <div className="field">
            <label htmlFor="pf-category">Category</label>
            {useNewCategory || categories.length === 0 ? (
              <input id="pf-category" type="text" value={form.category} onChange={(e) => update("category", e.target.value)} placeholder="e.g. Sparklers" />
            ) : (
              <select id="pf-category" value={form.category} onChange={(e) => update("category", e.target.value)}>
                <option value="">Choose a category…</option>
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            )}
            {categories.length > 0 && (
              <div className="field-hint">
                <a href="#" onClick={(e) => { e.preventDefault(); setUseNewCategory(v => !v); update("category", ""); }}>
                  {useNewCategory ? "Choose an existing category instead" : "Create a new category instead"}
                </a>
              </div>
            )}
          </div>

          <div className="field-row">
            <div className="field">
              <label htmlFor="pf-unit">Unit</label>
              <input id="pf-unit" type="text" value={form.unit} onChange={(e) => update("unit", e.target.value)} placeholder="e.g. box of 10" />
            </div>
            <div className="field">
              <label htmlFor="pf-price">Price (₹)</label>
              <input id="pf-price" type="number" min="0" step="1" value={form.price} onChange={(e) => update("price", e.target.value)} placeholder="e.g. 150" />
            </div>
          </div>

          <div className="field">
            <label htmlFor="pf-mrp">MRP / strike-through price (optional)</label>
            <input id="pf-mrp" type="number" min="0" step="1" value={form.mrp} onChange={(e) => update("mrp", e.target.value)} placeholder="Leave blank if no discount" />
            <div className="field-hint">Shown crossed out next to the price, if higher than the price.</div>
          </div>

          <div className="field">
            <label htmlFor="pf-img">Image URL (optional)</label>
            <input id="pf-img" type="text" value={form.img} onChange={(e) => update("img", e.target.value)} placeholder="https://…" />
            <div className="field-hint">Leave blank to use a placeholder image.</div>
          </div>

          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onCancel}>Cancel</button>
            <button type="submit" className="btn btn-primary">{initial ? "Save changes" : "Add product"}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ConfirmDeleteModal({ product, onCancel, onConfirm }) {
  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="cd-title">
      <div className="confirm-box">
        <h2 id="cd-title" className="modal-title">Delete this product?</h2>
        <p>"{product.name}" will be removed from the shop. This can't be undone.</p>
        <div className="modal-actions">
          <button type="button" className="btn btn-ghost" onClick={onCancel}>Cancel</button>
          <button type="button" className="btn btn-danger" onClick={onConfirm}>Delete product</button>
        </div>
      </div>
    </div>
  );
}

function SettingsModal({ initialNumber, initialPin, onCancel, onSave }) {
  const [number, setNumber] = useState(initialNumber);
  const [pin, setPin] = useState(initialPin);
  const [confirmPin, setConfirmPin] = useState(initialPin);
  const [error, setError] = useState("");

  function handleSubmit(e) {
    e.preventDefault();
    const digits = number.replace(/\D/g, "");
    if (digits.length < 8) { setError("Enter a valid WhatsApp number with country code, digits only (e.g. 919876543210)."); return; }
    if (!/^\d{4,6}$/.test(pin)) { setError("PIN must be 4 to 6 digits."); return; }
    if (pin !== confirmPin) { setError("PIN and confirmation don't match."); return; }
    onSave(digits, pin);
  }

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="set-title">
      <div className="modal">
        <h2 id="set-title" className="modal-title">Shop settings</h2>
        {error && <div className="modal-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="set-number">WhatsApp number for orders</label>
            <input id="set-number" type="text" value={number} onChange={(e) => setNumber(e.target.value)} placeholder="Country code + number, e.g. 919876543210" />
            <div className="field-hint">Digits only, starting with the country code. No + or spaces needed.</div>
          </div>
          <div className="field-row">
            <div className="field">
              <label htmlFor="set-pin">Admin PIN</label>
              <input id="set-pin" type="text" inputMode="numeric" maxLength="6" value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, ""))} placeholder="4–6 digits" />
            </div>
            <div className="field">
              <label htmlFor="set-pin-confirm">Confirm PIN</label>
              <input id="set-pin-confirm" type="text" inputMode="numeric" maxLength="6" value={confirmPin} onChange={(e) => setConfirmPin(e.target.value.replace(/\D/g, ""))} placeholder="Repeat PIN" />
            </div>
          </div>
          <div className="field-hint" style={{ marginTop: "-6px", marginBottom: "14px" }}>Tap the shop name 5 times on the main page to reach this PIN screen again.</div>
          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onCancel}>Cancel</button>
            <button type="submit" className="btn btn-primary">Save settings</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function Admin({ products, setProducts, theme, onCycleTheme, onBack }) {
  const [editing, setEditing] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [whatsappNumber, setWhatsappNumber] = useState(loadWhatsAppNumber());
  const [pin, setPin] = useState(loadPin());
  const [toast, setToast] = useState("");
  const [filterCat, setFilterCat] = useState("All");

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const categories = useMemo(() => {
    const set = [];
    products.forEach(p => { if (!set.includes(p.category)) set.push(p.category); });
    return set;
  }, [products]);

  const visible = useMemo(() => filterCat === "All" ? products : products.filter(p => p.category === filterCat), [products, filterCat]);

  function persist(next) { setProducts(next); saveProducts(next); }

  function handleSave(product) {
    const exists = products.some(p => p.id === product.id);
    const next = exists ? products.map(p => (p.id === product.id ? product : p)) : [...products, product];
    persist(next);
    setEditing(null);
    setToast(exists ? "Product updated." : "Product added.");
  }
  function handleDelete(product) {
    persist(products.filter(p => p.id !== product.id));
    setDeleting(null);
    setToast("Product deleted.");
  }
  function handleSaveSettings(num, newPin) {
    saveWhatsAppNumber(num); setWhatsappNumber(num);
    savePin(newPin); setPin(newPin);
    setShowSettings(false);
    setToast("Settings saved.");
  }

  return (
    <div>
      <header className="admin-header">
        <div className="admin-header-row">
          <button type="button" className="back-btn" onClick={onBack}>← Back to shop</button>
          <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
            <ThemeToggle theme={theme} onCycle={onCycleTheme} />
            <button type="button" className="btn btn-ghost btn-sm" onClick={() => setShowSettings(true)}>Shop settings</button>
          </div>
        </div>
      </header>

      <main className="admin-page">
        <h1 className="admin-title">Manage products</h1>
        <p className="admin-sub">Add, edit, or remove crackers. Changes are saved on this device and appear in the shop immediately.</p>

        <div className="admin-toolbar">
          <select className="plain-select" value={filterCat} onChange={(e) => setFilterCat(e.target.value)}>
            <option value="All">All categories ({products.length})</option>
            {categories.map(c => <option key={c} value={c}>{c} ({products.filter(p => p.category === c).length})</option>)}
          </select>
          <button type="button" className="btn btn-primary" onClick={() => setEditing({})}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: "6px" }}><PlusIcon /> Add product</span>
          </button>
        </div>

        {visible.length === 0 ? (
          <div className="admin-empty">
            <div style={{ fontSize: "16px", color: "var(--ink)", marginBottom: "6px", fontWeight: 600 }}>No products yet</div>
            <div style={{ marginBottom: "16px" }}>Add your first cracker to get the shop started.</div>
            <button type="button" className="btn btn-primary" onClick={() => setEditing({})}>Add product</button>
          </div>
        ) : (
          <div className="admin-table-wrap">
            <table className="admin-table">
              <thead>
                <tr><th>Product</th><th>Category</th><th>Unit</th><th>Price</th><th></th></tr>
              </thead>
              <tbody>
                {visible.map(product => (
                  <tr key={product.id}>
                    <td>
                      <div className="name-cell">
                        <img className="admin-thumb" src={product.img} alt="" onError={(e) => { e.target.style.opacity = "0.2"; }} />
                        <span>{product.name}</span>
                      </div>
                    </td>
                    <td><span className="cat-badge">{product.category}</span></td>
                    <td>{product.unit}</td>
                    <td className="price-cell">
                      {product.mrp && <span className="card-mrp">{formatRupees(product.mrp)}</span>}
                      {formatRupees(product.price)}
                    </td>
                    <td>
                      <div className="row-actions">
                        <button type="button" className="btn btn-ghost btn-sm" onClick={() => setEditing(product)}>Edit</button>
                        <button type="button" className="btn btn-danger btn-sm" onClick={() => setDeleting(product)}>Delete</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </main>

      {editing !== null && (
        <ProductFormModal initial={editing.id ? editing : null} categories={categories} onCancel={() => setEditing(null)} onSave={handleSave} />
      )}
      {deleting && (
        <ConfirmDeleteModal product={deleting} onCancel={() => setDeleting(null)} onConfirm={() => handleDelete(deleting)} />
      )}
      {showSettings && (
        <SettingsModal initialNumber={whatsappNumber} initialPin={pin} onCancel={() => setShowSettings(false)} onSave={handleSaveSettings} />
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ================= root ================= */

function App() {
  const [view, setView] = useState("shop"); // "shop" | "gate" | "admin"
  const [products, setProducts] = useState(loadProducts);
  const [theme, cycleTheme] = useTheme();

  useEffect(() => {
    try { if (!localStorage.getItem(STORAGE_KEY)) saveProducts(products); }
    catch (e) { console.error(e); }
  }, []);

  if (view === "gate") {
    return <PinGate onSuccess={() => setView("admin")} onCancel={() => setView("shop")} />;
  }
  if (view === "admin") {
    return <Admin products={products} setProducts={setProducts} theme={theme} onCycleTheme={cycleTheme} onBack={() => setView("shop")} />;
  }
  return <Storefront products={products} theme={theme} onCycleTheme={cycleTheme} onOpenAdminGate={() => setView("gate")} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>

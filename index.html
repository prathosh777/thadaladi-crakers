<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Velan Crackers</title>
<meta name="theme-color" content="#D7261E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #F1F3F6;
    --surface: #FFFFFF;
    --surface-2: #F5F5F5;
    --ink: #212121;
    --muted: #707070;
    --line: #E4E4E4;
    --accent: #D7261E;
    --accent-ink: #FFFFFF;
    --accent-wash: rgba(215,38,30,0.08);
    --header-bg: #D7261E;
    --good: #138808;
    --wa: #1FA855;
    --wa-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(0,0,0,0.06);

    box-sizing: border-box;
  }
  :root[data-theme="dark"] {
    --bg: #101010;
    --surface: #1C1C1C;
    --surface-2: #262626;
    --ink: #F1F1F1;
    --muted: #A0A0A0;
    --line: #333333;
    --accent: #FF5A4D;
    --accent-ink: #1A0B09;
    --accent-wash: rgba(255,90,77,0.14);
    --header-bg: #7A1712;
    --good: #5FD068;
    --wa: #25C463;
    --wa-ink: #07210F;
    --shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101010;
      --surface: #1C1C1C;
      --surface-2: #262626;
      --ink: #F1F1F1;
      --muted: #A0A0A0;
      --line: #333333;
      --accent: #FF5A4D;
      --accent-ink: #1A0B09;
      --accent-wash: rgba(255,90,77,0.14);
      --header-bg: #7A1712;
      --good: #5FD068;
      --wa: #25C463;
      --wa-ink: #07210F;
      --shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  #root { min-height: 100%; }
  .serif { font-family: inherit; font-weight: 700; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  a { color: var(--accent); }
  img { max-width: 100%; }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ================= storefront ================= */

  /* ---- header ---- */
  .topbar {
    background: var(--header-bg); color: #fff;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 12px;
  }
  .topbar-inner { max-width: 1200px; margin: 0 auto; }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .theme-toggle {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .theme-toggle svg { width: 18px; height: 18px; }
  .topbar .theme-toggle { background: rgba(255,255,255,0.16); border-color: transparent; color: #fff; }

  .view-toggle { display: flex; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: rgba(255,255,255,0.16); }
  .view-toggle button {
    background: transparent; border: none; color: rgba(255,255,255,0.75); width: 40px; height: 40px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .view-toggle button.active { background: #fff; color: var(--header-bg); }
  .view-toggle svg { width: 18px; height: 18px; }

  .search-row { position: relative; margin-top: 10px; }
  .search-input {
    width: 100%; background: #fff; border: none; color: #212121;
    font-size: 16px; /* 16px stops iOS zooming on focus */
    height: 44px; padding: 0 14px 0 42px; border-radius: 8px;
  }
  .search-input::placeholder { color: #8a8a8a; }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #707070; pointer-events: none; }

  /* ---- category chips (sticky) ---- */
  .rail-wrap {
    background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 39;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .rail { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; max-width: 1200px; margin: 0 auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .rail::-webkit-scrollbar { display: none; }
  .rail-chip {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    font-size: 13.5px; font-weight: 600; min-height: 36px; padding: 0 14px; border-radius: 18px; cursor: pointer; white-space: nowrap;
  }
  .rail-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ---- page ---- */
  .page { max-width: 1200px; margin: 0 auto; padding: 8px 8px 130px; }
  @media (min-width: 640px) { .page { padding: 16px 16px 130px; } }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 14px 4px 8px; }
  .section-title { font-size: 16px; font-weight: 800; margin: 0; }
  .section-count { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ---- info button styles ---- */
  .info-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    padding: 3px;
    z-index: 10;
  }
  :root[data-theme="dark"] .info-btn { background: rgba(0,0,0,0.8); border-color: #555; }
  .info-btn:active { transform: scale(0.95); }
  .info-btn svg { width: 100%; height: 100%; color: var(--accent); }
  .info-btn-small { top: -6px; right: -6px; width: 24px; height: 24px; padding: 2px; }

  /* ---- grid view ---- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; } }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow);
  }
  .card.checked { border-color: var(--accent); }
  .card-img-wrap { position: relative; background: var(--surface-2); }
  .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .card-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .card-name {
    font-size: 14px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-unit { color: var(--muted); font-size: 12px; }
  .price-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 6px; margin-top: 4px; }
  .card-price { font-weight: 800; font-size: 17px; }
  .card-mrp { color: var(--muted); font-size: 12.5px; text-decoration: line-through; }
  .off-tag { color: var(--good); font-size: 12px; font-weight: 700; }
  .card-action { margin-top: auto; padding-top: 8px; }

  .add-btn {
    width: 100%; height: 40px; background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent);
    font-size: 13.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
    border-radius: 6px; cursor: pointer;
  }
  .add-btn:active { background: var(--accent-wash); }

  .qty-row {
    width: 100%; height: 40px; display: flex; align-items: stretch; justify-content: space-between;
    background: var(--accent); color: var(--accent-ink); border-radius: 6px; overflow: hidden;
  }
  .qty-btn {
    background: transparent; border: none; color: inherit; width: 44px;
    font-size: 22px; font-weight: 600; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:active { background: rgba(0,0,0,0.12); }
  .qty-val { display: flex; align-items: center; justify-content: center; flex: 1; font-size: 15px; font-weight: 800; }

  /* ---- list view ---- */
  .rate-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rate-row { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid var(--line); }
  .rate-row:last-child { border-bottom: none; }
  .rate-thumb { width: 72px; height: 72px; border-radius: 6px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .rate-mid { flex: 1; min-width: 0; }
  .rate-name { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .rate-unit { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .rate-mid .price-line { margin-top: 4px; }
  .rate-action { flex-shrink: 0; width: 104px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .serif { font-size: 18px; color: var(--ink); margin-bottom: 6px; }
  .empty-state .btn { margin-top: 14px; }

  .skeleton { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .skeleton .sk-img { aspect-ratio: 1; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
  .skeleton .sk-line { height: 12px; margin: 10px; border-radius: 4px; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
  .skeleton .sk-line.short { width: 50%; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* ---- cart bar ---- */
  .checkout-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.10);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .checkout-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .checkout-meta { min-width: 0; }
  .checkout-count { font-size: 12px; color: var(--muted); }
  .checkout-total { font-size: 20px; font-weight: 800; line-height: 1.15; }
  .checkout-view-link {
    background: none; border: none; color: var(--accent); font-size: 12.5px; font-weight: 700;
    cursor: pointer; padding: 6px 0 0; text-decoration: underline;
  }
  .checkout-btn {
    background: var(--wa); color: var(--wa-ink); border: none;
    font-weight: 800; font-size: 15px; height: 48px; padding: 0 20px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; white-space: nowrap;
  }
  .checkout-btn:active { filter: brightness(0.92); }
  .checkout-btn svg { width: 20px; height: 20px; }

  /* ---- review & info sheet ---- */
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90;
    display: flex; align-items: flex-end; justify-content: center;
  }
  @media (min-width: 640px) { .sheet-overlay { align-items: center; } }
  .sheet {
    background: var(--surface); width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 18px 16px; max-height: 88vh; overflow-y: auto;
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 640px) { .sheet { border-radius: 12px; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-title { font-size: 17px; font-weight: 800; margin: 0; }
  .sheet-close { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px; margin: -8px; }
  .sheet-close svg { width: 22px; height: 22px; }
  .sheet-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .sheet-row .qty-row { width: 112px; flex-shrink: 0; }
  .sheet-row-name { font-size: 14px; font-weight: 600; }
  .sheet-row-unit { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sheet-row-total { font-weight: 800; font-size: 14px; min-width: 64px; text-align: right; }
  .sheet-remove { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px; margin: -4px; }
  .sheet-remove svg { width: 18px; height: 18px; }
  .sheet-total-row { display: flex; justify-content: space-between; padding-top: 14px; font-weight: 800; font-size: 17px; }

  .info-content {
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.6;
    white-space: pre-wrap;
    padding: 10px 0;
    margin-top: 4px;
    border-top: 1px solid var(--line);
  }

  /* ================= admin ================= */
  .admin-header {
    position: sticky; top: 0; z-index: 40;
    background: var(--header-bg); color: #fff;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
  }
  .admin-header-row { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .back-btn {
    background: none; border: none; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 4px 0 0; white-space: nowrap;
  }
  .admin-header-actions { display: flex; gap: 6px; align-items: center; }
  .admin-header .theme-toggle { background: rgba(255,255,255,0.16); border-color: transparent; color: #fff; }
  .admin-header .btn-ghost { color: #fff; border-color: rgba(255,255,255,0.4); }
  .admin-header .btn-ghost:active { background: rgba(255,255,255,0.16); }

  .admin-page { max-width: 900px; margin: 0 auto; padding: 14px 12px 110px; }
  .admin-title { font-size: 20px; margin: 0 0 2px; font-weight: 800; }
  .admin-sub { color: var(--muted); font-size: 12.5px; line-height: 1.4; margin: 0 0 14px; word-break: break-word; }

  .btn {
    font-size: 14px; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:active { filter: brightness(0.92); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-danger { background: transparent; border-color: var(--line); color: var(--accent); }
  .btn-danger:active { background: var(--accent-wash); }
  .btn-sm { min-height: 40px; padding: 0 12px; font-size: 13px; }

  .admin-toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  select.plain-select {
    flex: 1; min-width: 0; height: 44px; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    padding: 0 12px; border-radius: 8px; font-size: 16px;
  }
  .admin-toolbar .btn-add-desktop { display: none; }
  @media (min-width: 640px) {
    .admin-page { padding: 24px 16px 60px; }
    .admin-toolbar .btn-add-desktop { display: inline-flex; }
    .admin-toolbar select.plain-select { flex: 0 1 320px; }
    .admin-toolbar { justify-content: space-between; }
    .admin-fab { display: none !important; }
  }

  /* ---- product list (cards on every screen size) ---- */
  .admin-list { display: grid; gap: 10px; }
  @media (min-width: 640px) { .admin-list { grid-template-columns: 1fr 1fr; } }
  .admin-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: var(--shadow); }
  .admin-item-top { display: flex; gap: 12px; align-items: center; }
  .admin-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .admin-item-info { flex: 1; min-width: 0; }
  .admin-item-name { font-size: 15px; font-weight: 700; line-height: 1.3; word-break: break-word; }
  .admin-item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
  .cat-badge { background: var(--surface-2); color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; display: inline-block; }
  .admin-item-price { margin-top: 4px; display: flex; align-items: baseline; gap: 6px; }
  .admin-item-price strong { font-size: 16px; font-weight: 800; }
  .admin-item-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

  .admin-fab {
    position: fixed; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45;
    height: 52px; padding: 0 20px 0 16px; border-radius: 26px; box-shadow: 0 6px 18px rgba(0,0,0,0.3);
  }
  .admin-fab svg { width: 20px; height: 20px; }

  /* ---- modal (full-height sheet on phones, scrolls inside) ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; overscroll-behavior: contain; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal {
    background: var(--bg); width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 18px 16px 0; max-height: 94vh; max-height: 94dvh;
    overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  @media (min-width: 640px) { .modal { border-radius: 14px; padding: 22px 22px 0; } }
  .modal-title { font-size: 18px; margin: 0 0 14px; font-weight: 800; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; min-height: 46px; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    font-size: 16px; /* prevents iOS zoom on focus */ padding: 10px 12px; border-radius: 8px;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
  .field-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end; margin: 6px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
  }
  .modal-actions .btn { flex: 1; }
  @media (min-width: 640px) { .modal-actions { margin: 6px -22px 0; padding: 12px 22px 16px; } .modal-actions .btn { flex: 0 0 auto; } }
  .modal-error { background: var(--accent-wash); border: 1px solid var(--accent); color: var(--accent); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }

  .confirm-box {
    background: var(--bg); width: 100%; max-width: 420px; border-radius: 16px 16px 0 0;
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 640px) { .confirm-box { border-radius: 14px; padding: 22px; } }
  .confirm-box p { font-size: 14px; color: var(--ink); line-height: 1.5; margin: 0 0 16px; }
  .confirm-box .modal-actions { position: static; margin: 0; padding: 0; border: none; background: none; }

  .toast {
    position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13px;
    padding: 10px 18px; border-radius: 8px; z-index: 200; box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    max-width: calc(100vw - 32px); text-align: center;
  }

  .admin-empty { text-align: center; padding: 40px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  /* ---- remote admin additions ---- */
  .img-row { display: flex; gap: 12px; align-items: center; }
  .img-preview { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; border: 1px solid var(--line); }
  .field input[type="file"] { padding: 8px; font-size: 13px; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .empty-state .btn { margin-top: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ================= config, data layer ================= */

function safeGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch (e) { console.error("Storage write failed", e); return false; }
}

function loadCachedProducts() {
  try {
    const parsed = JSON.parse(safeGet(CACHE_PRODUCTS_KEY, "[]"));
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}

function normalizeProduct(r) {
  return {
    id: r.id,
    name: r.name,
    category: r.category,
    unit: r.unit,
    price: Number(r.price),
    mrp: r.mrp === null || r.mrp === undefined ? null : Number(r.mrp),
    img: r.img || PLACEHOLDER_IMG,
    details: r.details || "", // ADDED DETAILS FIELD
  };
}

async function fetchProducts() {
  const { data, error } = await sb.from("products").select("*").order("sort_order", { ascending: true });
  if (error) throw error;
  return data.map(normalizeProduct);
}

async function deleteProductRow(product) {
  const { data, error } = await sb.from("products").delete().eq("id", product.id).select();
  if (error) throw error;
  if (!data || data.length === 0) throw new Error("Not allowed. Please sign in again.");

    try { await sb.storage.from(BUCKET).remove([path]); } catch (e) { console.warn(e); }
  }
}

async function resizeImage(file, max = 900) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error("Could not process image"))), "image/jpeg", 0.85));
}
async function uploadProductImage(file) {
  if (!file.type.startsWith("image/")) throw new Error("Please choose an image file.");
  const blob = await resizeImage(file);
  const path = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

function formatRupees(n) { return "₹" + Number(n).toLocaleString("en-IN"); }

/* ================= theme ================= */

function useTheme() {
  const [theme, setTheme] = useState(() => safeGet(THEME_KEY, "system"));

  useEffect(() => {
    const root = document.documentElement;
    if (theme === "system") {
      root.removeAttribute("data-theme");
    } else {
      root.setAttribute("data-theme", theme);
    }
    safeSet(THEME_KEY, theme);
  }, [theme]);

  const cycleTheme = useCallback(() => {
    setTheme(prev => (prev === "system" ? "light" : prev === "light" ? "dark" : "system"));
  }, []);

  return [theme, cycleTheme];
}

function ThemeToggle({ theme, onCycle }) {
  const icon = theme === "light" ? <SunIcon /> : theme === "dark" ? <MoonIcon /> : <AutoIcon />;
  const label = theme === "light" ? "Light theme (tap for dark)" : theme === "dark" ? "Dark theme (tap for auto)" : "Auto theme (tap for light)";
  return (
    <button type="button" className="theme-toggle" onClick={onCycle} aria-label={label} title={label}>
      {icon}
    </button>
  );
}

function discountPct(p) {
  return p.mrp && p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
}

function PriceLine({ product }) {
  const off = discountPct(product);
  return (
    <div className="price-line">
      <span className="card-price">{formatRupees(product.price)}</span>
      {product.mrp && <span className="card-mrp">{formatRupees(product.mrp)}</span>}
      {off > 0 && <span className="off-tag">{off}% off</span>}
    </div>
  );
}

function AddControl({ product, qty, onToggle, onQtyChange }) {
  if (qty > 0) {
    return (
      <div className="qty-row">
        <button type="button" className="qty-btn" aria-label={"Decrease quantity of " + product.name} onClick={() => onQtyChange(product.id, qty - 1)}>−</button>

        <button type="button" className="qty-btn" aria-label={"Increase quantity of " + product.name} onClick={() => onQtyChange(product.id, qty + 1)}>+</button>
      </div>
    );
  }
  return <button type="button" className="add-btn" onClick={() => onToggle(product.id)}>Add</button>;
}

                <div>Try a different search term or category.</div>
              </>
            )}
          </div>
        ) : (
          Object.entries(grouped).map(([cat, items]) => (
            <section key={cat} id={"cat-" + cat.replace(/\s+/g, "-")}>
              <div className="section-head">
                <h2 className="section-title">{cat}</h2>
                <span className="section-count">{items.length} item{items.length !== 1 ? "s" : ""}</span>
              </div>
              <div className={itemWrap}>
                {items.map(product => (
                  <ItemComp 
                    key={product.id} 
                    product={product} 
                    qty={selected[product.id] || 0} 
                    onToggle={toggle} 
                    onQtyChange={setQty} 
                    onShowInfo={() => setInfoProduct(product)}
                  />
                ))}
              </div>
            </section>
          ))
        )}
      </main>

      {itemCount > 0 && (
        <div className="checkout-bar">
          <div className="checkout-inner">
            <div className="checkout-meta">
              <div className="checkout-count">{itemCount} item{itemCount !== 1 ? "s" : ""} added</div>
              <div className="checkout-total">{formatRupees(total)}</div>
              <button type="button" className="checkout-view-link" onClick={() => setShowReview(true)}>Review order</button>
            </div>
            <button type="button" className="checkout-btn" onClick={handleCheckout}>
              <WhatsAppIcon /> Order on WhatsApp
            </button>
          </div>
        </div>
      )}

      {showReview && (
        <ReviewSheet
          items={selectedItems}
          total={total}
          onRemove={(id) => setQty(id, 0)}
          onQtyChange={setQty}
          onClose={() => setShowReview(false)}
          onCheckout={() => { setShowReview(false); handleCheckout(); }}
        />
      )}

      {infoProduct && (
        <InfoModal 
          product={infoProduct} 
          onClose={() => setInfoProduct(null)} 
        />
      )}
    </div>
  );
}

/* ================= admin login ================= */

function LoginGate({ onSuccess, onCancel }) {
  const [email, setEmail] = useState(safeGet("svc_admin_email", ""));
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const emailRef = useRef(null);

  useEffect(() => { if (emailRef.current) emailRef.current.focus(); }, []);
  useEffect(() => {
    function handleKey(e) { if (e.key === "Escape") onCancel(); }
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    if (!sb) { setError("Supabase isn't configured yet. See the setup steps."); return; }
    setBusy(true); setError("");
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (error) { setError(error.message === "Invalid login credentials" ? "Wrong email or password." : error.message); setPassword(""); return; }
    safeSet("svc_admin_email", email.trim());
    onSuccess();
  }

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title" onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="confirm-box">
        <h2 id="login-title" className="modal-title">Admin login</h2>
        <p style={{ marginBottom: 14 }}>This area is for the shop owner only.</p>
        {error && <div className="modal-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="login-email">Email</label>
            <input id="login-email" ref={emailRef} type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} required />
          </div>
          <div className="field">
            <label htmlFor="login-pass">Password</label>
            <input id="login-pass" type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} required />
          </div>
          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onCancel}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

const BLANK_FORM = { name: "", category: "", unit: "", price: "", mrp: "", img: "", details: "" };

function ProductFormModal({ initial, categories, onCancel, onSave }) {
  const [form, setForm] = useState(initial ? { ...BLANK_FORM, ...initial, mrp: initial.mrp || "" } : BLANK_FORM);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [imgFile, setImgFile] = useState(null);
  const [preview, setPreview] = useState("");
  const [useNewCategory, setUseNewCategory] = useState(initial ? !categories.includes(initial.category) : categories.length === 0);
  const firstFieldRef = useRef(null);

  useEffect(() => { if (firstFieldRef.current) firstFieldRef.current.focus(); }, []);
  useEffect(() => {
    if (!imgFile) { setPreview(""); return; }
    const url = URL.createObjectURL(imgFile);
    setPreview(url);
    return () => URL.revokeObjectURL(url);
  }, [imgFile]);

  function update(field, value) { setForm(prev => ({ ...prev, [field]: value })); }

  async function handleSubmit(e) {
    e.preventDefault();
    if (busy) return;
    const name = form.name.trim();
    const category = form.category.trim();
    const unit = form.unit.trim();
    const priceNum = parseFloat(form.price);
    const mrpNum = form.mrp === "" ? null : parseFloat(form.mrp);

    if (!name) { setError("Enter a product name."); return; }
    if (!category) { setError("Enter or choose a category."); return; }
    if (!unit) { setError("Enter a unit, like 'box of 10'."); return; }
    if (isNaN(priceNum) || priceNum <= 0) { setError("Enter a price greater than 0."); return; }
    if (mrpNum !== null && (isNaN(mrpNum) || mrpNum <= priceNum)) { setError("MRP must be greater than the price, or left blank."); return; }

    setBusy(true); setError("");
    try {
      let img = form.img.trim();
      if (imgFile) img = await uploadProductImage(imgFile);
      await onSave({
        id: initial && initial.id ? initial.id : null,
        row: { 
          name, 
          category, 
          unit, 
          price: priceNum, 
          mrp: mrpNum, 
          img: img || PLACEHOLDER_IMG,
          details: form.details.trim() // SAVE DETAILS FIELD
        },
      });
    } catch (err) {
      setError(err.message || "Something went wrong. Try again.");
      setBusy(false);
    }
  }

  const shownImg = preview || form.img;

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pf-title">
      <div className="modal">
        <h2 id="pf-title" className="modal-title">{initial ? "Edit product" : "Add product"}</h2>
        {error && <div className="modal-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="pf-name">Product name</label>
            <input id="pf-name" ref={firstFieldRef} type="text" value={form.name} onChange={(e) => update("name", e.target.value)} placeholder="e.g. Wire Sparklers — 10 inch" />
          </div>

          <div className="field">
            <label htmlFor="pf-category">Category</label>
            {useNewCategory || categories.length === 0 ? (
              <input id="pf-category" type="text" value={form.category} onChange={(e) => update("category", e.target.value)} placeholder="e.g. Sparklers" />
            ) : (
              <select id="pf-category" value={form.category} onChange={(e) => update("category", e.target.value)}>
                <option value="">Choose a category…</option>
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            )}
            {categories.length > 0 && (
              <div className="field-hint">
                <a href="#" onClick={(e) => { e.preventDefault(); setUseNewCategory(v => !v); update("category", ""); }}>
                  {useNewCategory ? "Choose an existing category instead" : "Create a new category instead"}
                </a>
              </div>
            )}
          </div>

          <div className="field-row">
            <div className="field">
              <label htmlFor="pf-unit">Unit</label>
              <input id="pf-unit" type="text" value={form.unit} onChange={(e) => update("unit", e.target.value)} placeholder="e.g. box of 10" />
            </div>
            <div className="field">
              <label htmlFor="pf-price">Price (₹)</label>
              <input id="pf-price" type="number" min="0" step="any" inputMode="decimal" value={form.price} onChange={(e) => update("price", e.target.value)} placeholder="e.g. 150" />
            </div>
          </div>

          <div className="field">
            <label htmlFor="pf-mrp">MRP / strike-through price (optional)</label>
            <input id="pf-mrp" type="number" min="0" step="any" inputMode="decimal" value={form.mrp} onChange={(e) => update("mrp", e.target.value)} placeholder="Leave blank if no discount" />
          </div>

          {/* ADDED DETAILS FIELD FOR GIFT BOX INFO */}
          <div className="field">
            <label htmlFor="pf-details">Details / Contents (optional)</label>
            <textarea id="pf-details" rows="3" value={form.details} onChange={(e) => update("details", e.target.value)} placeholder="e.g. 10 Sparklers, 5 Flower Pots, etc."></textarea>
            <div className="field-hint">Use this for Gift Boxes. Any text typed here will show when a user clicks the "i" button on the storefront.</div>
          </div>

          <div className="field">
            <label htmlFor="pf-file">Photo</label>
            <div className="img-row">
              <img className="img-preview" src={shownImg || PLACEHOLDER_IMG} alt="" onError={(e) => { e.target.style.opacity = "0.25"; }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <input id="pf-file" type="file" accept="image/*" onChange={(e) => setImgFile(e.target.files && e.target.files[0] ? e.target.files[0] : null)} />
                <div className="field-hint">Upload from your phone or computer. It's resized automatically.</div>
              </div>
            </div>
            <input id="pf-img" type="text" style={{ marginTop: 8 }} value={form.img} onChange={(e) => update("img", e.target.value)} placeholder="…or paste an image URL" aria-label="Image URL" />
          </div>

          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : (initial ? "Save changes" : "Add product")}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ConfirmDeleteModal({ product, onCancel, onConfirm }) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  async function go() {
    setBusy(true); setError("");
    try { await onConfirm(); } catch (e) { setError(e.message || "Delete failed."); setBusy(false); }
  }
  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="cd-title">
      <div className="confirm-box">
        <h2 id="cd-title" className="modal-title">Delete this product?</h2>
        <p>"{product.name}" will be removed from the shop for everyone. This can't be undone.</p>
        {error && <div className="modal-error">{error}</div>}
        <div className="modal-actions">
          <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={busy}>Cancel</button>
          <button type="button" className="btn btn-danger" onClick={go} disabled={busy}>{busy ? "Deleting…" : "Delete product"}</button>
        </div>
      </div>
    </div>
  );
}

function SettingsModal({ initialNumber, onCancel, onSave }) {
  const [number, setNumber] = useState(initialNumber);
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    const digits = number.replace(/\D/g, "");
    if (digits.length < 8) { setError("Enter a valid WhatsApp number with country code, digits only (e.g. 919876543210)."); return; }
    if (password && password.length < 8) { setError("New password must be at least 8 characters."); return; }
    setBusy(true); setError("");
    try { await onSave(digits, password); }
    catch (err) { setError(err.message || "Could not save settings."); setBusy(false); }
  }

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="set-title">
      <div className="modal">
        <h2 id="set-title" className="modal-title">Shop settings</h2>
        {error && <div className="modal-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="set-number">WhatsApp number for orders</label>
            <input id="set-number" type="text" inputMode="numeric" value={number} onChange={(e) => setNumber(e.target.value)} placeholder="Country code + number, e.g. 919876543210" />
            <div className="field-hint">Digits only, starting with the country code. No + or spaces needed.</div>
          </div>
          <div className="field">
            <label htmlFor="set-pass">Change admin password (optional)</label>
            <input id="set-pass" type="password" autoComplete="new-password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Leave blank to keep the current one" />
          </div>
          <div className="field-hint" style={{ marginBottom: "14px" }}>Tap the shop name 5 times on the main page to reach the admin login again.</div>
          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : "Save settings"}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function Admin({ products, whatsapp, userEmail, theme, onCycleTheme, onBack, onRefresh, onWhatsAppSaved, onSignOut }) {
  const [editing, setEditing] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [toast, setToast] = useState("");
  const [filterCat, setFilterCat] = useState("All");

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const categories = useMemo(() => {
    const set = [];
    products.forEach(p => { if (!set.includes(p.category)) set.push(p.category); });
    return set;
  }, [products]);

  const visible = useMemo(() => filterCat === "All" ? products : products.filter(p => p.category === filterCat), [products, filterCat]);

  async function handleSave({ id, row }) {
    await saveProductRow(id, row);
    await onRefresh();
    setEditing(null);
    setToast(id ? "Product updated." : "Product added.");
  }
  async function handleDelete(product) {
    await deleteProductRow(product);
    await onRefresh();
    setDeleting(null);
    setToast("Product deleted.");
  }
  async function handleSaveSettings(num, newPassword) {
    if (num !== whatsapp) { await saveWhatsApp(num); onWhatsAppSaved(num); }
    if (newPassword) {
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) throw error;
    }
    setShowSettings(false);
    setToast("Settings saved.");
  }

  return (
    <div>
      <header className="admin-header">
        <div className="admin-header-row">
          <button type="button" className="back-btn" onClick={onBack}>← Shop</button>
          <div className="admin-header-actions">
            <ThemeToggle theme={theme} onCycle={onCycleTheme} />
            <button type="button" className="btn btn-ghost btn-sm" onClick={() => setShowSettings(true)}>Settings</button>
            <button type="button" className="btn btn-ghost btn-sm" onClick={onSignOut}>Sign out</button>
          </div>
        </div>
      </header>

      <main className="admin-page">
        <h1 className="admin-title">Manage products</h1>
        <p className="admin-sub">Signed in as {userEmail}. Changes show in the shop for every customer immediately.</p>

        <div className="admin-toolbar">
          <select className="plain-select" value={filterCat} onChange={(e) => setFilterCat(e.target.value)} aria-label="Filter by category">
            <option value="All">All categories ({products.length})</option>
            {categories.map(c => <option key={c} value={c}>{c} ({products.filter(p => p.category === c).length})</option>)}
          </select>
          <button type="button" className="btn btn-primary btn-add-desktop" onClick={() => setEditing({})}>
            <PlusIcon /> Add product
          </button>
        </div>

        {visible.length === 0 ? (
          <div className="admin-empty">
            <div style={{ fontSize: "16px", color: "var(--ink)", marginBottom: "6px", fontWeight: 600 }}>No products here</div>
            <div style={{ marginBottom: "16px" }}>Add a cracker to get the shop started.</div>
            <button type="button" className="btn btn-primary" onClick={() => setEditing({})}>Add product</button>
          </div>
        ) : (
          <div className="admin-list">
            {visible.map(product => (
              <div className="admin-item" key={product.id}>
                <div className="admin-item-top">
                  <img className="admin-thumb" src={product.img} alt="" onError={(e) => { e.target.style.opacity = "0.2"; }} />
                  <div className="admin-item-info">
                    <div className="admin-item-name">{product.name}</div>
                    <div className="admin-item-meta">
                      <span className="cat-badge">{product.category}</span>
                      <span>{product.unit}</span>
                      {/* Show an indicator in admin if details exist */}
                      {product.details && <span style={{ color: 'var(--accent)', fontWeight: 600 }}>ℹ️ Details added</span>}
                    </div>
                    <div className="admin-item-price">
                      <strong>{formatRupees(product.price)}</strong>
                      {product.mrp && <span className="card-mrp">{formatRupees(product.mrp)}</span>}
                    </div>
                  </div>
                </div>
                <div className="admin-item-actions">
                  <button type="button" className="btn btn-ghost btn-sm" onClick={() => setEditing(product)}>Edit</button>
                  <button type="button" className="btn btn-danger btn-sm" onClick={() => setDeleting(product)}>Delete</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </main>

      <button type="button" className="btn btn-primary admin-fab" onClick={() => setEditing({})} aria-label="Add product">
        <PlusIcon /> Add product
      </button>

      {editing !== null && (
        <ProductFormModal initial={editing.id ? editing : null} categories={categories} onCancel={() => setEditing(null)} onSave={handleSave} />
      )}
      {deleting && (
        <ConfirmDeleteModal product={deleting} onCancel={() => setDeleting(null)} onConfirm={() => handleDelete(deleting)} />
      )}
      {showSettings && (
        <SettingsModal initialNumber={whatsapp} onCancel={() => setShowSettings(false)} onSave={handleSaveSettings} />
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ================= root ================= */

function App() {
  const [view, setView] = useState("shop"); // "shop" | "login" | "admin"
  const [products, setProducts] = useState(loadCachedProducts);
  const [whatsapp, setWhatsapp] = useState(() => safeGet(CACHE_WA_KEY, DEFAULT_WHATSAPP_NUMBER));
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [session, setSession] = useState(null);
  const [theme, cycleTheme] = useTheme();

  const refresh = useCallback(async () => {
    if (!sb) {
      setLoadError("The shop database isn't connected yet. Add the Supabase URL and key in index.html.");
      setLoading(false);
      return;
    }
    try {
      const [list, wa] = await Promise.all([fetchProducts(), fetchWhatsApp()]);
      setProducts(list);
      setWhatsapp(wa);
      setLoadError("");
      safeSet(CACHE_PRODUCTS_KEY, JSON.stringify(list));
      safeSet(CACHE_WA_KEY, wa);
    } catch (e) {
      console.error(e);
      setLoadError("Check your internet connection and try again.");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    refresh();
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, [refresh]);

  // Pick up changes made elsewhere when the customer returns to the tab
  useEffect(() => {
    function onVisible() { if (document.visibilityState === "visible") refresh(); }
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [refresh]);

  // If the session ends while in admin, drop back to the shop
  useEffect(() => { if (view === "admin" && !session) setView("shop"); }, [session, view]);

  function openAdmin() { setView(session ? "admin" : "login"); }
  async function signOut() { if (sb) await sb.auth.signOut(); setView("shop"); }

  if (view === "login") {
    return <LoginGate onSuccess={() => setView("admin")} onCancel={() => setView("shop")} />;
  }
  if (view === "admin" && session) {
    return (
      <Admin
        products={products}
        whatsapp={whatsapp}
        userEmail={session.user.email}
        theme={theme}
        onCycleTheme={cycleTheme}
        onBack={() => setView("shop")}
        onRefresh={refresh}
        onWhatsAppSaved={(n) => { setWhatsapp(n); safeSet(CACHE_WA_KEY, n); }}
        onSignOut={signOut}
      />
    );
  }
  return (
    <Storefront
      products={products}
      whatsapp={whatsapp}
      loading={loading}
      loadError={loadError}
      onRetry={() => { setLoading(true); refresh(); }}
      theme={theme}
      onCycleTheme={cycleTheme}
      onOpenAdminGate={openAdmin}
    />
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

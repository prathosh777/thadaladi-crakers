<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Velan Crackers</title>
<meta name="theme-color" content="#D7261E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #F1F3F6;
    --surface: #FFFFFF;
    --surface-2: #F5F5F5;
    --ink: #212121;
    --muted: #707070;
    --line: #E4E4E4;
    --accent: #D7261E;
    --accent-ink: #FFFFFF;
    --accent-wash: rgba(215,38,30,0.08);
    --header-bg: #D7261E;
    --good: #138808;
    --wa: #1FA855;
    --wa-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(0,0,0,0.06);

    box-sizing: border-box;
  }
  :root[data-theme="dark"] {
    --bg: #101010;
    --surface: #1C1C1C;
    --surface-2: #262626;
    --ink: #F1F1F1;
    --muted: #A0A0A0;
    --line: #333333;
    --accent: #FF5A4D;
    --accent-ink: #1A0B09;
    --accent-wash: rgba(255,90,77,0.14);
    --header-bg: #7A1712;
    --good: #5FD068;
    --wa: #25C463;
    --wa-ink: #07210F;
    --shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101010;
      --surface: #1C1C1C;
      --surface-2: #262626;
      --ink: #F1F1F1;
      --muted: #A0A0A0;
      --line: #333333;
      --accent: #FF5A4D;
      --accent-ink: #1A0B09;
      --accent-wash: rgba(255,90,77,0.14);
      --header-bg: #7A1712;
      --good: #5FD068;
      --wa: #25C463;
      --wa-ink: #07210F;
      --shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  #root { min-height: 100%; }
  .serif { font-family: inherit; font-weight: 700; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  a { color: var(--accent); }
  img { max-width: 100%; }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ================= storefront ================= */

  /* ---- header ---- */
  .topbar {
    background: var(--header-bg); color: #fff;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 12px;
  }
  .topbar-inner { max-width: 1200px; margin: 0 auto; }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .theme-toggle {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .theme-toggle svg { width: 18px; height: 18px; }
  .topbar .theme-toggle { background: rgba(255,255,255,0.16); border-color: transparent; color: #fff; }

  .view-toggle { display: flex; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: rgba(255,255,255,0.16); }
  .view-toggle button {
    background: transparent; border: none; color: rgba(255,255,255,0.75); width: 40px; height: 40px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .view-toggle button.active { background: #fff; color: var(--header-bg); }
  .view-toggle svg { width: 18px; height: 18px; }

  .search-row { position: relative; margin-top: 10px; }
  .search-input {
    width: 100%; background: #fff; border: none; color: #212121;
    font-size: 16px; /* 16px stops iOS zooming on focus */
    height: 44px; padding: 0 14px 0 42px; border-radius: 8px;
  }
  .search-input::placeholder { color: #8a8a8a; }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #707070; pointer-events: none; }

  /* ---- category chips (sticky) ---- */
  .rail-wrap {
    background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 39;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .rail { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; max-width: 1200px; margin: 0 auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .rail::-webkit-scrollbar { display: none; }
  .rail-chip {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    font-size: 13.5px; font-weight: 600; min-height: 36px; padding: 0 14px; border-radius: 18px; cursor: pointer; white-space: nowrap;
  }
  .rail-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ---- page ---- */
  .page { max-width: 1200px; margin: 0 auto; padding: 8px 8px 130px; }
  @media (min-width: 640px) { .page { padding: 16px 16px 130px; } }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 14px 4px 8px; }
  .section-title { font-size: 16px; font-weight: 800; margin: 0; }
  .section-count { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ---- info button styles ---- */
  .info-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    padding: 3px;
    z-index: 10;
  }
  :root[data-theme="dark"] .info-btn { background: rgba(0,0,0,0.8); border-color: #555; }
  .info-btn:active { transform: scale(0.95); }
  .info-btn svg { width: 100%; height: 100%; color: var(--accent); }
  .info-btn-small { top: -6px; right: -6px; width: 24px; height: 24px; padding: 2px; }

  /* ---- grid view ---- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; } }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow);
  }
  .card.checked { border-color: var(--accent); }
  .card-img-wrap { position: relative; background: var(--surface-2); }
  .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .card-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .card-name {
    font-size: 14px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-unit { color: var(--muted); font-size: 12px; }
  .price-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 6px; margin-top: 4px; }
  .card-price { font-weight: 800; font-size: 17px; }
  .card-mrp { color: var(--muted); font-size: 12.5px; text-decoration: line-through; }
  .off-tag { color: var(--good); font-size: 12px; font-weight: 700; }
  .card-action { margin-top: auto; padding-top: 8px; }

  .add-btn {
    width: 100%; height: 40px; background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent);
    font-size: 13.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
    border-radius: 6px; cursor: pointer;
  }
  .add-btn:active { background: var(--accent-wash); }

  .qty-row {
    width: 100%; height: 40px; display: flex; align-items: stretch; justify-content: space-between;
    background: var(--accent); color: var(--accent-ink); border-radius: 6px; overflow: hidden;
  }
  .qty-btn {
    background: transparent; border: none; color: inherit; width: 44px;
    font-size: 22px; font-weight: 600; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:active { background: rgba(0,0,0,0.12); }
  .qty-val { display: flex; align-items: center; justify-content: center; flex: 1; font-size: 15px; font-weight: 800; }

  /* ---- list view ---- */
  .rate-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rate-row { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid var(--line); }
  .rate-row:last-child { border-bottom: none; }
  .rate-thumb { width: 72px; height: 72px; border-radius: 6px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .rate-mid { flex: 1; min-width: 0; }
  .rate-name { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .rate-unit { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .rate-mid .price-line { margin-top: 4px; }
  .rate-action { flex-shrink: 0; width: 104px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .serif { font-size: 18px; color: var(--ink); margin-bottom: 6px; }
  .empty-state .btn { margin-top: 14px; }

  .skeleton { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .skeleton .sk-img { aspect-ratio: 1; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
  .skeleton .sk-line { height: 12px; margin: 10px; border-radius: 4px; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
  .skeleton .sk-line.short { width: 50%; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* ---- cart bar ---- */
  .checkout-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.10);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .checkout-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .checkout-meta { min-width: 0; }
  .checkout-count { font-size: 12px; color: var(--muted); }
  .checkout-total { font-size: 20px; font-weight: 800; line-height: 1.15; }
  .checkout-view-link {
    background: none; border: none; color: var(--accent); font-size: 12.5px; font-weight: 700;
    cursor: pointer; padding: 6px 0 0; text-decoration: underline;
  }
  .checkout-btn {
    background: var(--wa); color: var(--wa-ink); border: none;
    font-weight: 800; font-size: 15px; height: 48px; padding: 0 20px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; white-space: nowrap;
  }
  .checkout-btn:active { filter: brightness(0.92); }
  .checkout-btn svg { width: 20px; height: 20px; }

  /* ---- review & info sheet ---- */
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90;
    display: flex; align-items: flex-end; justify-content: center;
  }
  @media (min-width: 640px) { .sheet-overlay { align-items: center; } }
  .sheet {
    background: var(--surface); width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 18px 16px; max-height: 88vh; overflow-y: auto;
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 640px) { .sheet { border-radius: 12px; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-title { font-size: 17px; font-weight: 800; margin: 0; }
  .sheet-close { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px; margin: -8px; }
  .sheet-close svg { width: 22px; height: 22px; }
  .sheet-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .sheet-row .qty-row { width: 112px; flex-shrink: 0; }
  .sheet-row-name { font-size: 14px; font-weight: 600; }
  .sheet-row-unit { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sheet-row-total { font-weight: 800; font-size: 14px; min-width: 64px; text-align: right; }
  .sheet-remove { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px; margin: -4px; }
  .sheet-remove svg { width: 18px; height: 18px; }
  .sheet-total-row { display: flex; justify-content: space-between; padding-top: 14px; font-weight: 800; font-size: 17px; }

  .info-content {
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.6;
    white-space: pre-wrap;
    padding: 10px 0;
    margin-top: 4px;
    border-top: 1px solid var(--line);
  }

  /* ================= admin ================= */
  .admin-header {
    position: sticky; top: 0; z-index: 40;
    background: var(--header-bg); color: #fff;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
  }
  .admin-header-row { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .back-btn {
    background: none; border: none; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 4px 0 0; white-space: nowrap;
  }
  .admin-header-actions { display: flex; gap: 6px; align-items: center; }
  .admin-header .theme-toggle { background: rgba(255,255,255,0.16); border-color: transparent; color: #fff; }
  .admin-header .btn-ghost { color: #fff; border-color: rgba(255,255,255,0.4); }
  .admin-header .btn-ghost:active { background: rgba(255,255,255,0.16); }

  .admin-page { max-width: 900px; margin: 0 auto; padding: 14px 12px 110px; }
  .admin-title { font-size: 20px; margin: 0 0 2px; font-weight: 800; }
  .admin-sub { color: var(--muted); font-size: 12.5px; line-height: 1.4; margin: 0 0 14px; word-break: break-word; }

  .btn {
    font-size: 14px; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:active { filter: brightness(0.92); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-danger { background: transparent; border-color: var(--line); color: var(--accent); }
  .btn-danger:active { background: var(--accent-wash); }
  .btn-sm { min-height: 40px; padding: 0 12px; font-size: 13px; }

  .admin-toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  select.plain-select {
    flex: 1; min-width: 0; height: 44px; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    padding: 0 12px; border-radius: 8px; font-size: 16px;
  }
  .admin-toolbar .btn-add-desktop { display: none; }
  @media (min-width: 640px) {
    .admin-page { padding: 24px 16px 60px; }
    .admin-toolbar .btn-add-desktop { display: inline-flex; }
    .admin-toolbar select.plain-select { flex: 0 1 320px; }
    .admin-toolbar { justify-content: space-between; }
    .admin-fab { display: none !important; }
  }

  /* ---- product list (cards on every screen size) ---- */
  .admin-list { display: grid; gap: 10px; }
  @media (min-width: 640px) { .admin-list { grid-template-columns: 1fr 1fr; } }
  .admin-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: var(--shadow); }
  .admin-item-top { display: flex; gap: 12px; align-items: center; }
  .admin-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .admin-item-info { flex: 1; min-width: 0; }
  .admin-item-name { font-size: 15px; font-weight: 700; line-height: 1.3; word-break: break-word; }
  .admin-item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
  .cat-badge { background: var(--surface-2); color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; display: inline-block; }
  .admin-item-price { margin-top: 4px; display: flex; align-items: baseline; gap: 6px; }
  .admin-item-price strong { font-size: 16px; font-weight: 800; }
  .admin-item-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

  .admin-fab {
    position: fixed; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45;
    height: 52px; padding: 0 20px 0 16px; border-radius: 26px; box-shadow: 0 6px 18px rgba(0,0,0,0.3);
  }
  .admin-fab svg { width: 20px; height: 20px; }

  /* ---- modal (full-height sheet on phones, scrolls inside) ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; overscroll-behavior: contain; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal {
    background: var(--bg); width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 18px 16px 0; max-height: 94vh; max-height: 94dvh;
    overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  @media (min-width: 640px) { .modal { border-radius: 14px; padding: 22px 22px 0; } }
  .modal-title { font-size: 18px; margin: 0 0 14px; font-weight: 800; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; min-height: 46px; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    font-size: 16px; /* prevents iOS zoom on focus */ padding: 10px 12px; border-radius: 8px;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
  .field-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end; margin: 6px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
  }
  .modal-actions .btn { flex: 1; }
  @media (min-width: 640px) { .modal-actions { margin: 6px -22px 0; padding: 12px 22px 16px; } .modal-actions .btn { flex: 0 0 auto; } }
  .modal-error { background: var(--accent-wash); border: 1px solid var(--accent); color: var(--accent); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }

  .confirm-box {
    background: var(--bg); width: 100%; max-width: 420px; border-radius: 16px 16px 0 0;
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 640px) { .confirm-box { border-radius: 14px; padding: 22px; } }
  .confirm-box p { font-size: 14px; color: var(--ink); line-height: 1.5; margin: 0 0 16px; }
  .confirm-box .modal-actions { position: static; margin: 0; padding: 0; border: none; background: none; }

  .toast {
    position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13px;
    padding: 10px 18px; border-radius: 8px; z-index: 200; box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    max-width: calc(100vw - 32px); text-align: center;
  }

  .admin-empty { text-align: center; padding: 40px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  /* ---- remote admin additions ---- */
  .img-row { display: flex; gap: 12px; align-items: center; }
  .img-preview { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; border: 1px solid var(--line); }
  .field input[type="file"] { padding: 8px; font-size: 13px; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .empty-state .btn { margin-top: 14px; }

  /* ---- private cloud billing ---- */
  .admin-tabs { display:flex; gap:6px; margin:0 0 18px; border-bottom:1px solid var(--line); padding-bottom:10px; }

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ================= config, data layer ================= */

// 1) Paste your Supabase project values here (Project Settings → API).
const SUPABASE_URL = "https://uhzmjqvirfilavuzplpc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_fLLSDUKyhJIWxmaRpGq93A_ApujR_3G";

const CONFIGURED = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR-ANON-KEY");
const sb = CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const BUCKET = "product-images";
const THEME_KEY = "svc_theme_v2";
const CACHE_PRODUCTS_KEY = "svc_cache_products_v1";
const CACHE_WA_KEY = "svc_cache_whatsapp_v1";
const DEFAULT_WHATSAPP_NUMBER = "918438014305";
const PLACEHOLDER_IMG = "https://images.unsplash.com/photo-1533230050512-dc65cca0a921?w=300&q=60";

function safeGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch (e) { console.error("Storage write failed", e); return false; }
}

function loadCachedProducts() {
  try {
    const parsed = JSON.parse(safeGet(CACHE_PRODUCTS_KEY, "[]"));
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}

function normalizeProduct(r) {
  return {
    id: r.id,
    name: r.name,
    category: r.category,
    unit: r.unit,
    price: Number(r.price),
    mrp: r.mrp === null || r.mrp === undefined ? null : Number(r.mrp),
    img: r.img || PLACEHOLDER_IMG,
    details: r.details || "", // ADDED DETAILS FIELD
  };
}

async function fetchProducts() {
  const { data, error } = await sb.from("products").select("*").order("sort_order", { ascending: true });
  if (error) throw error;
  return data.map(normalizeProduct);
}
async function fetchWhatsApp() {
  const { data, error } = await sb.from("settings").select("value").eq("key", "whatsapp_number").maybeSingle();
  if (error) throw error;
  return data ? data.value : DEFAULT_WHATSAPP_NUMBER;
}
async function saveWhatsApp(num) {
  const { data, error } = await sb.from("settings").upsert({ key: "whatsapp_number", value: num }).select();
  if (error) throw error;
  if (!data || data.length === 0) throw new Error("Not allowed. Please sign in again.");
}
async function saveProductRow(id, row) {
  const q = id ? sb.from("products").update(row).eq("id", id) : sb.from("products").insert(row);
  const { data, error } = await q.select();
  if (error) throw error;
  if (!data || data.length === 0) throw new Error("Not allowed. Please sign in again.");
}
async function deleteProductRow(product) {
  const { data, error } = await sb.from("products").delete().eq("id", product.id).select();
  if (error) throw error;
  if (!data || data.length === 0) throw new Error("Not allowed. Please sign in again.");
  const marker = "/" + BUCKET + "/";
  const i = (product.img || "").indexOf(marker);
  if (i !== -1) {
    const path = decodeURIComponent(product.img.slice(i + marker.length).split("?")[0]);
    try { await sb.storage.from(BUCKET).remove([path]); } catch (e) { console.warn(e); }
  }
}

async function resizeImage(file, max = 900) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error("Could not process image"))), "image/jpeg", 0.85));
}
async function uploadProductImage(file) {
  if (!file.type.startsWith("image/")) throw new Error("Please choose an image file.");
  const blob = await resizeImage(file);
  const path = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

function formatRupees(n) { return "₹" + Number(n).toLocaleString("en-IN"); }

/* ================= theme ================= */

function useTheme() {
  const [theme, setTheme] = useState(() => safeGet(THEME_KEY, "system"));

  useEffect(() => {
    const root = document.documentElement;
    if (theme === "system") {
      root.removeAttribute("data-theme");
    } else {
      root.setAttribute("data-theme", theme);
    }
    safeSet(THEME_KEY, theme);
  }, [theme]);

  const cycleTheme = useCallback(() => {
    setTheme(prev => (prev === "system" ? "light" : prev === "light" ? "dark" : "system"));
  }, []);

  return [theme, cycleTheme];
}

/* ================= icons ================= */

const CheckIcon = () => (<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5L8 14.5L16 6" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>);
const WhatsAppIcon = () => (<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4a7.94 7.94 0 0 0-6.9 11.9L4 20l4.2-1.1a7.9 7.9 0 0 0 3.85 1h.01a7.94 7.94 0 0 0 5.6-13.58h-.06zM12.05 18.5h-.01a6.6 6.6 0 0 1-3.36-.92l-.24-.14-2.5.65.67-2.43-.16-.25a6.58 6.58 0 0 1 10.17-8.3 6.53 6.53 0 0 1 1.94 4.67 6.6 6.6 0 0 1-6.5 6.72zm3.6-4.93c-.2-.1-1.17-.58-1.35-.64-.18-.07-.31-.1-.44.1-.13.19-.5.64-.62.77-.11.13-.23.14-.42.05a5.4 5.4 0 0 1-1.6-.98 5.98 5.98 0 0 1-1.1-1.37c-.12-.19 0-.3.09-.4.09-.09.19-.23.29-.35.1-.11.13-.19.2-.32.06-.13.03-.24-.02-.34-.05-.1-.44-1.06-.6-1.45-.16-.38-.32-.33-.44-.33h-.38c-.13 0-.34.05-.51.24-.18.19-.68.66-.68 1.61 0 .95.7 1.87.8 2 .1.13 1.37 2.09 3.32 2.93.46.2.83.32 1.11.41.47.15.9.13 1.24.08.38-.06 1.17-.48 1.33-.94.17-.46.17-.86.12-.94-.05-.08-.18-.13-.38-.23z"/></svg>);
const CloseIcon = () => (<svg viewBox="0 0 20 20" fill="none"><path d="M5 5L15 15M15 5L5 15" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>);
const PlusIcon = () => (<svg viewBox="0 0 20 20" fill="none"><path d="M10 4V16M4 10H16" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>);
const SunIcon = () => (<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="4" stroke="currentColor" strokeWidth="1.6"/><path d="M10 1.5V3.5M10 16.5V18.5M18.5 10H16.5M3.5 10H1.5M15.8 4.2L14.4 5.6M5.6 14.4L4.2 15.8M15.8 15.8L14.4 14.4M5.6 5.6L4.2 4.2" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>);
const MoonIcon = () => (<svg viewBox="0 0 20 20" fill="none"><path d="M17 11.2A7 7 0 1 1 8.8 3a5.6 5.6 0 0 0 8.2 8.2z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/></svg>);
const AutoIcon = () => (<svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4" width="15" height="11" rx="1.5" stroke="currentColor" strokeWidth="1.5"/><path d="M7 17H13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>);
const GridIcon = () => (<svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/></svg>);
const ListIcon = () => (<svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3.5" width="4" height="4" rx="1" stroke="currentColor" strokeWidth="1.5"/><path d="M9 5.5H17.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><rect x="2.5" y="12.5" width="4" height="4" rx="1" stroke="currentColor" strokeWidth="1.5"/><path d="M9 14.5H17.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>);
const SearchIcon = () => (<svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" strokeWidth="1.6"/><path d="M17 17L13.5 13.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>);
const TrashIcon = () => (<svg viewBox="0 0 20 20" fill="none"><path d="M4 5.5H16M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M6 5.5l.7 10.2a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9L14 5.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>);
const InfoIcon = () => (<svg viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clipRule="evenodd" /></svg>);

/* ================= theme toggle button ================= */

function ThemeToggle({ theme, onCycle }) {
  const icon = theme === "light" ? <SunIcon /> : theme === "dark" ? <MoonIcon /> : <AutoIcon />;
  const label = theme === "light" ? "Light theme (tap for dark)" : theme === "dark" ? "Dark theme (tap for auto)" : "Auto theme (tap for light)";
  return (
    <button type="button" className="theme-toggle" onClick={onCycle} aria-label={label} title={label}>
      {icon}
    </button>
  );
}

/* ================= storefront ================= */

function discountPct(p) {
  return p.mrp && p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
}

function PriceLine({ product }) {
  const off = discountPct(product);
  return (
    <div className="price-line">
      <span className="card-price">{formatRupees(product.price)}</span>
      {product.mrp && <span className="card-mrp">{formatRupees(product.mrp)}</span>}
      {off > 0 && <span className="off-tag">{off}% off</span>}
    </div>
  );
}

function AddControl({ product, qty, onToggle, onQtyChange }) {
  if (qty > 0) {
    return (
      <div className="qty-row">
        <button type="button" className="qty-btn" aria-label={"Decrease quantity of " + product.name} onClick={() => onQtyChange(product.id, qty - 1)}>−</button>
        <span className="qty-val" aria-live="polite">{qty}</span>
        <button type="button" className="qty-btn" aria-label={"Increase quantity of " + product.name} onClick={() => onQtyChange(product.id, qty + 1)}>+</button>
      </div>

function Storefront({ products, whatsapp, loading, loadError, onRetry, theme, onCycleTheme, onOpenAdminGate }) {
  const [selected, setSelected] = useState({});
  const [activeCategory, setActiveCategory] = useState("All");
  const [query, setQuery] = useState("");
  const [view, setView] = useState("grid"); // grid | list
  const [showReview, setShowReview] = useState(false);
  const [infoProduct, setInfoProduct] = useState(null); // Track which product info to show
  
  const brandTapCount = useRef(0);
  const brandTapTimer = useRef(null);
  const listTopRef = useRef(null);

  const categories = useMemo(() => {
    const set = [];
    products.forEach(p => { if (!set.includes(p.category)) set.push(p.category); });
    return set;
  }, [products]);

  useEffect(() => {
    if (activeCategory !== "All" && !categories.includes(activeCategory)) setActiveCategory("All");
  }, [categories, activeCategory]);

  const filtered = useMemo(() => {
    return products.filter(p => {
      const matchesCat = activeCategory === "All" || p.category === activeCategory;
      const matchesQuery = query.trim() === "" || p.name.toLowerCase().includes(query.trim().toLowerCase());
      return matchesCat && matchesQuery;
    });
  }, [products, activeCategory, query]);

  const grouped = useMemo(() => {
    const map = {};
    filtered.forEach(p => {
      if (!map[p.category]) map[p.category] = [];
      map[p.category].push(p);
    });
    return map;
  }, [filtered]);

  function toggle(id) {
    setSelected(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = 1;
      return next;
    });
  }
  function setQty(id, qty) {
    setSelected(prev => {
      const next = { ...prev };
      if (qty <= 0) delete next[id]; else next[id] = Math.min(qty, 99);
      return next;
    });
  }

  const selectedItems = useMemo(() => {
    return Object.entries(selected).map(([id, qty]) => {
      const product = products.find(p => p.id === id);
      return product ? { ...product, qty } : null;
    }).filter(Boolean);
  }, [selected, products]);

  const itemCount = selectedItems.reduce((s, i) => s + i.qty, 0);
  const total = selectedItems.reduce((s, i) => s + i.qty * i.price, 0);

  function handleCheckout() {
    if (selectedItems.length === 0) return;
    const lines = selectedItems.map((i, idx) => `${idx + 1}. ${i.name} (${i.unit}) x${i.qty} — ${formatRupees(i.price * i.qty)}`);
    const message = "Hi! I'd like to order the following crackers:\n\n" + lines.join("\n") + `\n\nTotal: ${formatRupees(total)}\n\nPlease confirm availability. Thank you!`;
    const url = `https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank", "noopener,noreferrer");
  }

  function pickCategory(cat) {
    setActiveCategory(cat);
    if (listTopRef.current) {
      const y = listTopRef.current.getBoundingClientRect().top + window.pageYOffset - 56;
      window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
    }
  }

  function handleBrandTap() {
    brandTapCount.current += 1;
    if (brandTapTimer.current) clearTimeout(brandTapTimer.current);
    brandTapTimer.current = setTimeout(() => { brandTapCount.current = 0; }, 1500);
    if (brandTapCount.current >= 5) {
      brandTapCount.current = 0;
      onOpenAdminGate();
    }
  }

  const ItemComp = view === "grid" ? GridCard : RateRow;
  const itemWrap = view === "grid" ? "grid" : "rate-list";
  const showSkeleton = loading && products.length === 0;

  return (
    <div>
      <header className="topbar">
        <div className="topbar-inner">
          <div className="topbar-row">
            {/* --- BRAND DETAILS --- */}
            <div 
              className="brand-container" 
              onClick={handleBrandTap} 
              style={{ 
                display: "flex", 
                alignItems: "center", 
                gap: "10px", 
                cursor: "pointer", 
                userSelect: "none",
                minWidth: 0,
                flex: 1,
                paddingRight: "6px"
              }}
              role="button"
              aria-label="Velan Crackers Admin Trigger"
            >
              <img 
                src="./logo (2).jpeg" 
                alt="Velan Crackers logo" 
                style={{ width: "52px", height: "52px", borderRadius: "10px", objectFit: "cover", flexShrink: 0, border: "1px solid var(--line)" }} 
              />
              <div style={{ display: "flex", flexDirection: "column", minWidth: 0, flex: 1 }}>
                <span className="brand-name serif" style={{ fontSize: "17px", fontWeight: "700", lineHeight: 1.25, color: "white" }}>Velan Crackers</span>
                
                <span className="brand-sub" style={{ fontSize: "11px", color: "white", lineHeight: 1.4, whiteSpace: "normal", display: "block", marginTop: "2px" }}>
                  Wholesale &amp; retail<br />
                  Ph: +91 96002 09256, +91 93841 72262
                </span>
                
                <div style={{ display: "flex", gap: "6px", alignItems: "center", fontSize: "10.5px", color: "white", marginTop: "4px", flexWrap: "wrap" }}>
                  <span>Since 2016</span>
                  <span>•</span>
                  <span style={{ color: "var(--accent)", fontWeight: "600" }} onClick={(e) => e.stopPropagation()}>
                    <a href="https://www.instagram.com/anbu_samrajyamm" target="_blank" rel="noopener noreferrer" style={{ color: "inherit", textDecoration: "underline" }}>Anbu samrajyam</a>
                  </span>
                </div>
              </div>
            </div>

            {/* --- TOGGLES --- */}
            <div className="topbar-actions">
              <div className="view-toggle" role="group" aria-label="Layout">
                <button type="button" className={view === "grid" ? "active" : ""} aria-pressed={view === "grid"} aria-label="Grid view" onClick={() => setView("grid")}><GridIcon /></button>
                <button type="button" className={view === "list" ? "active" : ""} aria-pressed={view === "list"} aria-label="List view" onClick={() => setView("list")}><ListIcon /></button>
              </div>
              <ThemeToggle theme={theme} onCycle={onCycleTheme} />
            </div>
          </div>
          
          <div className="search-row">
            <span className="search-icon"><SearchIcon /></span>
            <input type="search" className="search-input" placeholder="Search crackers" value={query} onChange={(e) => setQuery(e.target.value)} aria-label="Search crackers" />
          </div>
        </div>
      </header>

      <div className="rail-wrap">
        <div className="rail">
          <button type="button" className={"rail-chip" + (activeCategory === "All" ? " active" : "")} onClick={() => pickCategory("All")}>All</button>
          {categories.map(cat => (
            <button key={cat} type="button" className={"rail-chip" + (activeCategory === cat ? " active" : "")} onClick={() => pickCategory(cat)}>{cat}</button>
          ))}
        </div>
      </div>

      <main className="page" ref={listTopRef}>
        {showSkeleton ? (
          <SkeletonGrid />
        ) : Object.keys(grouped).length === 0 ? (
          <div className="empty-state">
            {loadError && products.length === 0 ? (
              <>
                <div className="serif">Couldn't load the catalogue</div>
                <div>{loadError}</div>
                <button type="button" className="btn btn-primary" onClick={onRetry}>Try again</button>
              </>
            ) : (
              <>
                <div className="serif">No crackers found</div>
                <div>Try a different search term or category.</div>
              </>
            )}
          </div>
        ) : (
          Object.entries(grouped).map(([cat, items]) => (
            <section key={cat} id={"cat-" + cat.replace(/\s+/g, "-")}>
              <div className="section-head">
                <h2 className="section-title">{cat}</h2>
                <span className="section-count">{items.length} item{items.length !== 1 ? "s" : ""}</span>
              </div>
              <div className={itemWrap}>
                {items.map(product => (
                  <ItemComp 
                    key={product.id} 
                    product={product} 
                    qty={selected[product.id] || 0} 
                    onToggle={toggle} 
                    onQtyChange={setQty} 
                    onShowInfo={() => setInfoProduct(product)}
                  />
                ))}
              </div>
            </section>
          ))
        )}
      </main>

      {itemCount > 0 && (
        <div className="checkout-bar">
          <div className="checkout-inner">
            <div className="checkout-meta">
              <div className="checkout-count">{itemCount} item{itemCount !== 1 ? "s" : ""} added</div>
              <div className="checkout-total">{formatRupees(total)}</div>
              <button type="button" className="checkout-view-link" onClick={() => setShowReview(true)}>Review order</button>
            </div>
            <button type="button" className="checkout-btn" onClick={handleCheckout}>
              <WhatsAppIcon /> Order on WhatsApp
            </button>
          </div>
        </div>
      )}

      {showReview && (
        <ReviewSheet
          items={selectedItems}
          total={total}
          onRemove={(id) => setQty(id, 0)}
          onQtyChange={setQty}
          onClose={() => setShowReview(false)}
          onCheckout={() => { setShowReview(false); handleCheckout(); }}
        />
      )}

      {infoProduct && (
        <InfoModal 
          product={infoProduct} 
          onClose={() => setInfoProduct(null)} 
        />
      )}
    </div>
  );
}

function LoginGate({ onSuccess, onCancel }) {
  const [email, setEmail] = useState(safeGet("svc_admin_email", ""));
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const emailRef = useRef(null);

  useEffect(() => { if (emailRef.current) emailRef.current.focus(); }, []);
  useEffect(() => {
    function handleKey(e) { if (e.key === "Escape") onCancel(); }
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    if (!sb) { setError("Supabase isn't configured yet. See the setup steps."); return; }
    setBusy(true); setError("");
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (error) { setError(error.message === "Invalid login credentials" ? "Wrong email or password." : error.message); setPassword(""); return; }
    safeSet("svc_admin_email", email.trim());
    onSuccess();
  }

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title" onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="confirm-box">
        <h2 id="login-title" className="modal-title">Admin login</h2>
        <p style={{ marginBottom: 14 }}>This area is for the shop owner only.</p>
        {error && <div className="modal-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="login-email">Email</label>
            <input id="login-email" ref={emailRef} type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} required />
          </div>
          <div className="field">
            <label htmlFor="login-pass">Password</label>
            <input id="login-pass" type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} required />
          </div>
          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onCancel}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

const INVOICE_BUCKET = 'invoice-pdfs';
const SHOP_DEFAULTS = { shop_name: 'Velan Crackers', shop_phone: '+91 96002 09256 / +91 93841 72262', shop_address: '' };
const roundMoney = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const invoiceCurrency = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const safeHtml = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const dateLocal = () => { const d = new Date(); return [d.getFullYear(), String(d.getMonth() + 1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); };

async function getBillingOwner() {
  const { data, error } = await sb.auth.getUser();
  if (error || !data || !data.user) throw new Error('Please sign in again to manage bills.');
  return data.user.id;
}

function lineMrp(item) {
  const mrp = Number(item.unit_mrp);
  return item.unit_mrp !== null && item.unit_mrp !== '' && Number.isFinite(mrp) && mrp > 0 ? mrp : null;
}
function calculateBill(lines, discount, delivery) {
  const subtotal = roundMoney(lines.reduce((sum, item) => sum + Number(item.quantity || 0) * Number(item.unit_price || 0), 0));
  // Unknown MRP is NOT counted as a saving; compare against the selling rate instead.
  const mrp_total = roundMoney(lines.reduce((sum, item) => sum + Number(item.quantity || 0) * (lineMrp(item) ?? Number(item.unit_price || 0)), 0));
  const product_savings = roundMoney(lines.reduce((sum, item) => sum + Number(item.quantity || 0) * Math.max(0, (lineMrp(item) ?? Number(item.unit_price || 0)) - Number(item.unit_price || 0)), 0));
  const discount_amount = roundMoney(Math.max(0, Number(discount) || 0));
  const delivery_amount = roundMoney(Math.max(0, Number(delivery) || 0));
  return { subtotal, mrp_total, product_savings, discount_amount, delivery_amount,
    total_savings: roundMoney(product_savings + discount_amount),
    grand_total: roundMoney(Math.max(0, subtotal - discount_amount + delivery_amount)) };
}

      <tbody>${rows}</tbody>
    </table>
    ${totals}
    <div style="position:absolute;bottom:31px;left:40px;right:40px;border-top:1px solid #ddd;padding-top:10px;display:flex;justify-content:space-between;font-size:11px;color:#777">
      <span>Thank you for shopping with ${safeHtml(profile.shop_name)}!</span><span>Page ${pageNo} of ${pageCount}</span>
    </div>
    </div>`;
}

async function makeInvoicePdf(bill) {
  if (!window.jspdf || !window.html2canvas) throw new Error('PDF library could not load. Check your internet connection.');
  const profile = bill.shop_snapshot || SHOP_DEFAULTS;
  const items = Array.isArray(bill.items) ? bill.items : [];
  const pages = Math.max(1, Math.ceil(items.length / 11));
  const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
  const holder = document.createElement('div');
  holder.setAttribute('aria-hidden','true');
  holder.style.cssText = 'position:fixed;left:-20000px;top:0;width:760px;z-index:-1;pointer-events:none;';
  document.body.appendChild(holder);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    for (let p = 0; p < pages; p++) {
      holder.innerHTML = invoicePageHtml(bill, profile, items.slice(p*11, (p+1)*11), p+1, pages);
      const canvas = await window.html2canvas(holder.firstElementChild, { backgroundColor: '#ffffff', scale: 1.7, logging: false, useCORS: false });
      if (p > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.87), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    }
    return pdf.output('blob');
  } finally { holder.remove(); }
}

async function uploadInvoicePdf(bill, ownerId) {
  const blob = await makeInvoicePdf(bill);
  const storagePath = `${ownerId}/${bill.id}.pdf`;
  const { error: uploadError } = await sb.storage.from(INVOICE_BUCKET).upload(storagePath, blob, { upsert: true, contentType: 'application/pdf', cacheControl: '3600' });
  if (uploadError) throw uploadError;
  const { data, error } = await sb.from('invoices').update({ pdf_path: storagePath, status:'ready' }).eq('id', bill.id).select('*').single();
  if (error) throw error;
  return data;
}

function downloadInvoiceBlob(blob, invoiceNumber) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (invoiceNumber || 'Velan-Crackers-Bill') + '.pdf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function invoiceSignedUrl(bill) {
  if (!bill.pdf_path) throw new Error('PDF not stored yet. Select Retry PDF first.');
  const { data, error } = await sb.storage.from(INVOICE_BUCKET).createSignedUrl(bill.pdf_path, 7 * 24 * 60 * 60);
  if (error) throw error;
  return data.signedUrl;
}

function BillEditor({ products, profile, onClose, onSaved, initialBill = null }) {
  // The catalogue and bill share a single set of line items. Product CRUD outside billing is untouched.
  const [billDate, setBillDate] = useState(initialBill?.invoice_date || dateLocal());
  const newRowId = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);
  const [lines, setLines] = useState(() => (Array.isArray(initialBill?.items) ? initialBill.items : []).map(item => ({ ...item, unit_mrp: item.unit_mrp ?? '', row_id:newRowId() })));
  const [catalogSearch, setCatalogSearch] = useState('');
  const [activeCategory, setActiveCategory] = useState('All');
  const [mobilePane, setMobilePane] = useState('catalogue');
  const [expandedItems, setExpandedItems] = useState({});
  const [showExtras, setShowExtras] = useState(() => Number(initialBill?.discount_amount || 0) > 0 || Number(initialBill?.delivery_amount || 0) > 0 || !!initialBill?.notes);
  const productSearchRef = useRef(null);
  const [discount, setDiscount] = useState(String(initialBill?.discount_amount ?? 0));
  const [delivery, setDelivery] = useState(String(initialBill?.delivery_amount ?? 0));
  const [paymentStatus] = useState(initialBill?.payment_status || 'unpaid');
  const [paymentMethod] = useState(initialBill?.payment_method || 'Cash');
  const [notes, setNotes] = useState(initialBill?.notes || '');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const totals = useMemo(() => calculateBill(lines, discount, delivery), [lines, discount, delivery]);
  const totalQuantity = useMemo(() => lines.reduce((a, l) => a + (Number(l.quantity) || 0), 0), [lines]);
  const categories = useMemo(() => ['All', ...new Set(products.map(p => String(p.category || '').trim()).filter(Boolean))], [products]);
  const matches = useMemo(() => {
    const q = catalogSearch.trim().toLocaleLowerCase();
    return products.filter(p => (activeCategory === 'All' || p.category === activeCategory) &&
      (!q || (String(p.name || '') + ' ' + String(p.category || '') + ' ' + String(p.unit || '')).toLocaleLowerCase().includes(q)));
  }, [products, activeCategory, catalogSearch]);
  const selectedCounts = useMemo(() => lines.reduce((obj, item) => {
    if (item.product_id != null) obj[String(item.product_id)] = (obj[String(item.product_id)] || 0) + (Number(item.quantity) || 0);
    return obj;
  }, {}), [lines]);

  const updateLine = (id, patch) => setLines(prev => prev.map(l => l.row_id === id ? { ...l, ...patch } : l));
  const removeLine = (id) => setLines(prev => prev.filter(l => l.row_id !== id));
  const adjustProduct = (product, delta) => {
    if (busy) return;
    setLines(prev => {
      const index = prev.findIndex(l => String(l.product_id) === String(product.id));
      if (index >= 0) {
        const newQty = Math.min(10000, Math.max(0, (Number(prev[index].quantity) || 0) + delta));
        return newQty === 0 ? prev.filter((_, i) => i !== index) : prev.map((l, i) => i === index ? {...l, quantity:newQty} : l);
      }
      if (delta <= 0) return prev;
      const rawMrp = product.mrp == null || product.mrp === '' ? null : Number(product.mrp);
      const mrp = rawMrp !== null && Number.isFinite(rawMrp) && rawMrp > 0 ? rawMrp : '';
      return [...prev, { row_id:newRowId(), product_id:product.id, name:product.name, unit:product.unit || '', quantity:1,
        unit_price:Number(product.price) || 0, unit_mrp:mrp }];
    });
  };
  const addCustom = () => {
    if (busy) return;
    const row = newRowId();
    setLines(prev => [...prev, {row_id:row, product_id:null, name:'', unit:'', quantity:1, unit_price:0, unit_mrp:''}]);
    setExpandedItems(prev => ({...prev,[row]:true}));
    setMobilePane('bill');
  };
  function onSearchKeyDown(e) {
    if (e.key === 'Escape') { setCatalogSearch(''); e.preventDefault(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (matches.length) { adjustProduct(matches[0], 1); setCatalogSearch(''); }
    }
  }
  useEffect(() => {
    const handler = e => {
      if ((e.key === '/' && !e.ctrlKey && !e.metaKey) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
        const tag = e.target?.tagName?.toLowerCase();
        if (e.key === '/' && (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target?.isContentEditable)) return;
        e.preventDefault(); setMobilePane('catalogue'); productSearchRef.current?.focus();
      }
    };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  async function save(e, downloadAfter = false) {
    e.preventDefault();
    if (busy) return;
    setError('');
    if (!billDate) { setError('Select a bill date.'); return; }
    if (!lines.length) { setError('Add at least one cracker to the bill.'); return; }
    const cleanLines = lines.map(l => ({ product_id:l.product_id || null, name:String(l.name || '').trim(), unit:String(l.unit || '').trim(),
      quantity:Number(l.quantity), unit_price:roundMoney(l.unit_price),
      unit_mrp:l.unit_mrp === '' || l.unit_mrp === null ? null : roundMoney(l.unit_mrp) }));
    if (cleanLines.some(l => !l.name || !Number.isInteger(l.quantity) || l.quantity < 1 || l.quantity > 10000 || !Number.isFinite(l.unit_price) || l.unit_price < 0 ||
      (l.unit_mrp !== null && (!Number.isFinite(l.unit_mrp) || l.unit_mrp <= 0 || l.unit_mrp < l.unit_price)))) {
      setError('Check every item: name, quantity (1–10,000), selling rate, and an MRP that is at least the selling rate (or leave MRP blank).'); return;
    }
    if (![discount,delivery].every(x => x !== '' && Number.isFinite(Number(x)) && Number(x) >= 0) || totals.discount_amount > totals.subtotal) {
      setError('Extra discount and delivery amounts must be valid; extra discount cannot exceed the selling subtotal.'); return;
    }
    setBusy(true);
    let savedRow = null;
    try {
      const owner = await getBillingOwner();
      const { subtotal, discount_amount, delivery_amount, grand_total } = totals;
      // Existing schemas require customer_name; do not collect any customer information.
      const payload = { invoice_date:billDate, items:cleanLines, subtotal, discount_amount, delivery_amount, grand_total,
        notes:notes.trim(), payment_status:paymentStatus, payment_method:paymentMethod,
        shop_snapshot:{ ...profile }, status:'draft', pdf_path:null };
      const result = initialBill
        ? await sb.from('invoices').update(payload).eq('id',initialBill.id).eq('owner_id',owner).select('*').single()
        : await sb.from('invoices').insert({ ...payload, owner_id:owner, customer_name:'Counter Sale', customer_phone:'', customer_address:'', customer_email:'' }).select('*').single();
      if (result.error) throw result.error;
      savedRow = result.data;
      const completed = await uploadInvoicePdf(savedRow, owner);
      if (downloadAfter) {
        try {
          const { data:pdfFile, error:downloadErr } = await sb.storage.from(INVOICE_BUCKET).download(completed.pdf_path);
          if (downloadErr) throw downloadErr;
          downloadInvoiceBlob(pdfFile, completed.invoice_number);
        } catch (downloadErr) {
          onSaved(completed, 'Bill and PDF were saved in Supabase, but local download failed. Use Download PDF in Saved bills. ' + (downloadErr.message || ''));
          return;
        }
      }
      onSaved(completed, null);
    } catch (err) {
      if (savedRow) onSaved(savedRow, 'Bill details were saved, but PDF upload failed. Use Retry PDF in Saved bills. ' + (err.message || ''));
      else setError(err.message || 'Could not save the bill. Check the Supabase SQL setup.');
    } finally { setBusy(false); }
  }



  return <div className="bill-editor pos-editor">
    <div className="pos-topbar">
      <div className="pos-heading"><h2 className="admin-title">{initialBill ? 'Edit bill · '+initialBill.invoice_number : 'New sales bill'}</h2>
        <p className="admin-sub">Fast counter billing · Catalogue prices stay unchanged</p></div>
      <div className="pos-top-actions">
        <div className="pos-date-control"><label htmlFor="pos-bill-date">Bill date</label><input id="pos-bill-date" type="date" required value={billDate} onChange={e=>setBillDate(e.target.value)} disabled={busy} /></div>
        <button type="button" className="btn btn-ghost btn-sm" onClick={onClose} disabled={busy}>Saved bills</button>
      </div>
    </div>
    {error && <div className="modal-error" role="alert">{error}</div>}
    <form onSubmit={e=>save(e,false)}>
      <div className="pos-mobile-tabs" role="group" aria-label="Billing panels">
        <button type="button" className={mobilePane==='catalogue'?'active':''} aria-pressed={mobilePane==='catalogue'} onClick={()=>setMobilePane('catalogue')}>Find products</button>
        <button type="button" className={mobilePane==='bill'?'active':''} aria-pressed={mobilePane==='bill'} onClick={()=>setMobilePane('bill')}>Current bill <span>{totalQuantity}</span></button>
      </div>
      <div className="pos-workspace">
        <section className={'pos-catalogue'+(mobilePane==='catalogue'?' pos-visible-mobile':'')} aria-label="Crackers catalogue">
          <div className="pos-panel-title"><h3>Products</h3><span>{matches.length} found</span></div>
          <div className="pos-search-field"><span><SearchIcon /></span>
            <input ref={productSearchRef} id="pos-search" type="search" value={catalogSearch} onChange={e=>setCatalogSearch(e.target.value)} onKeyDown={onSearchKeyDown}
              placeholder="Search cracker name or category" aria-label="Search cracker products" autoComplete="off" disabled={busy} />
            {catalogSearch && <button type="button" className="pos-clear-search" aria-label="Clear search" onClick={()=>{setCatalogSearch('');productSearchRef.current?.focus();}}>×</button>}
          </div>
          <div className="pos-category-rail" aria-label="Filter by category">{categories.map(c => <button type="button" key={c}
            className={activeCategory===c?'active':''} aria-pressed={activeCategory===c} onClick={()=>setActiveCategory(c)}>{c}</button>)}</div>
          <div className="pos-catalogue-list" role="list" aria-label="Available crackers">
            {matches.length===0 && <div className="pos-empty-list">No matching crackers. Try another search or choose All.</div>}
            {matches.map(p => { const qty = selectedCounts[String(p.id)] || 0;
              const price = Number(p.price) || 0;
              const mrp = p.mrp == null || p.mrp==='' ? null : Number(p.mrp);
              const saving = mrp && mrp>price ? mrp-price : 0;
              return <div className={'pos-product'+(qty?' pos-product-selected':'')} role="listitem" key={p.id}>
                <div className="pos-product-info"><strong title={p.name}>{p.name}</strong><span>{p.unit || 'Item'}{p.category?' · '+p.category:''}</span></div>
                <div className="pos-product-price"><strong>{invoiceCurrency(price)}</strong>
                  {saving>0 ? <small>MRP {invoiceCurrency(mrp)} · Save {invoiceCurrency(saving)}</small> : <small>{mrp?'MRP '+invoiceCurrency(mrp):'MRP not set'}</small>}</div>
                {qty ? <PosQuantityControl busy={busy} small value={qty} label={p.name} onMinus={()=>adjustProduct(p,-1)} onPlus={()=>adjustProduct(p,1)} /> :
                  <button className="pos-product-add" type="button" disabled={busy} onClick={()=>adjustProduct(p,1)} aria-label={'Add '+p.name+' to bill'}>+ Add</button>}
              </div>;
            })}
          </div>
          <div className="pos-catalogue-hint">Tap <b>Add</b> or use <b>+</b> / <b>−</b> · Press <b>Enter</b> to add first search match</div>
        </section>

        <section className={'pos-ticket'+(mobilePane==='bill'?' pos-visible-mobile':'')} aria-label="Current bill">
          <div className="pos-ticket-header"><div><h3>Current bill <span>{lines.length} items</span></h3><p>{totalQuantity} units selected</p></div>
            <div className="pos-ticket-actions"><button type="button" onClick={addCustom} disabled={busy}>+ Custom</button>
              {lines.length>0 && <button className="pos-clear-bill" type="button" disabled={busy} onClick={()=>{if(window.confirm('Clear all items from this bill?')){setLines([]);setExpandedItems({});}}}>Clear</button>}</div></div>
          {!lines.length ? <div className="pos-ticket-empty"><div className="pos-empty-symbol">＋</div><strong>Your bill is empty</strong><span>Search and add products to start billing.</span>
            <button type="button" onClick={()=>{setMobilePane('catalogue');productSearchRef.current?.focus();}}>Find crackers</button></div> :
            <div className="pos-ticket-lines">{lines.map((line,index)=>{
              const qty=Number(line.quantity)||0;
              const rate=Number(line.unit_price)||0;
              const mrp=lineMrp(line);
              const saving=roundMoney(qty * Math.max(0,(mrp??rate)-rate));
              const showEdit=!!expandedItems[line.row_id];
              return <div className="pos-ticket-line" key={line.row_id}>
                <div className="pos-line-top"><span className="pos-line-index">{index+1}</span><div className="pos-line-name"><strong>{line.name || 'New custom item'}</strong>
                  <span>{line.unit || 'Item'}{mrp!==null ? ' · MRP '+invoiceCurrency(mrp) : ' · MRP not set'}</span></div>
                  <div className="pos-line-side"><b>{invoiceCurrency(qty*rate)}</b>{saving>0 && <small>Save {invoiceCurrency(saving)}</small>}</div>
                  <button className="pos-line-remove" type="button" title="Remove item" aria-label={'Remove '+(line.name||'item')} disabled={busy} onClick={()=>removeLine(line.row_id)}><TrashIcon /></button>
                </div>
                <div className="pos-line-controls"><PosQuantityControl busy={busy} value={line.quantity} label={line.name||'custom item'}
                   onMinus={()=>updateLine(line.row_id,{quantity:Math.max(1,Number(line.quantity||1)-1)})}
                   onPlus={()=>updateLine(line.row_id,{quantity:Math.min(10000,Number(line.quantity||0)+1)})}
                   onValue={value=>updateLine(line.row_id,{quantity:value})} />
                  <label className="pos-line-rate">Rate ₹<input type="number" inputMode="decimal" min="0" step="0.01" required disabled={busy} value={line.unit_price} onChange={e=>updateLine(line.row_id,{unit_price:e.target.value})} aria-label={'Selling price of '+line.name} /></label>
                  <button className="pos-edit-toggle" type="button" aria-expanded={showEdit} disabled={busy} onClick={()=>setExpandedItems(prev=>({...prev,[line.row_id]:!prev[line.row_id]}))}>{showEdit?'Done':'Edit'}</button>
                </div>
                {showEdit && <div className="pos-edit-fields">
                  <label>Product name<input type="text" required disabled={busy} value={line.name} onChange={e=>updateLine(line.row_id,{name:e.target.value})} /></label>
                  <label>Unit<input type="text" disabled={busy} value={line.unit} onChange={e=>updateLine(line.row_id,{unit:e.target.value})} placeholder="Box" /></label>
                  <label>MRP ₹<input type="number" inputMode="decimal" min="0.01" step="0.01" disabled={busy} value={line.unit_mrp??''} onChange={e=>updateLine(line.row_id,{unit_mrp:e.target.value})} placeholder="Not set" /></label>
                </div>}
              </div>;
            })}</div>}
          <div className="pos-ticket-bottom">
            <div className="pos-bill-summary">
              <div><span>MRP / listed value</span><b>{invoiceCurrency(totals.mrp_total)}</b></div>
              {totals.product_savings>0 && <div className="pos-saving"><span>Saved from MRP</span><b>− {invoiceCurrency(totals.product_savings)}</b></div>}
              <div><span>Selling subtotal</span><b>{invoiceCurrency(totals.subtotal)}</b></div>
              {totals.discount_amount>0 && <div><span>Extra discount</span><b>− {invoiceCurrency(totals.discount_amount)}</b></div>}
              {totals.delivery_amount>0 && <div><span>Delivery / extra</span><b>+ {invoiceCurrency(totals.delivery_amount)}</b></div>}
              <div className="pos-total"><span>Grand total</span><strong>{invoiceCurrency(totals.grand_total)}</strong></div>
              <div className="pos-saving pos-total-savings"><span>Total discount</span><b>{invoiceCurrency(totals.total_savings)}</b></div>
            </div>
            <button type="button" className="pos-extras-toggle" aria-expanded={showExtras} onClick={()=>setShowExtras(v=>!v)}>{showExtras?'− Hide':'＋ Add'} extra discount / delivery / note</button>
            {showExtras && <div className="pos-extras">
              <label>Extra bill discount ₹<input type="number" step="0.01" min="0" disabled={busy} value={discount} onChange={e=>setDiscount(e.target.value)} /></label>
              <label>Delivery / extra ₹<input type="number" step="0.01" min="0" disabled={busy} value={delivery} onChange={e=>setDelivery(e.target.value)} /></label>
              <label className="pos-note">Note (optional)<input type="text" disabled={busy} value={notes} onChange={e=>setNotes(e.target.value)} /></label>
            </div>}
            <div className="pos-save-actions"><button className="pos-save-main" type="button" disabled={busy||!lines.length} onClick={e=>save(e,true)}>{busy?'Saving…':'Save & download PDF'}</button>
              <button className="pos-save-secondary" type="submit" disabled={busy||!lines.length}>Save to cloud</button></div>
            <p className="pos-save-caption">Bills and PDFs are stored in private Supabase storage. No customer details or GST fields.</p>
          </div>
        </section>
      </div>
      {mobilePane==='catalogue' && <div className="pos-mobile-bottom"><div><small>{totalQuantity} units · {lines.length} items</small><b>{invoiceCurrency(totals.grand_total)}</b></div>
        <button type="button" onClick={()=>setMobilePane('bill')}>View bill →</button></div>}
    </form>
  </div>;
}

  return <div className="bill-panel"><div className="billing-head"><h2 className="admin-title">Details printed on bills</h2><button type="button" className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button></div>
    {error && <div className="modal-error">{error}</div>}
    <form onSubmit={save}><div className="field"><label>Shop name</label><input required value={form.shop_name} onChange={e => setForm({...form,shop_name:e.target.value})} /></div>
      <div className="field"><label>Shop phone number(s)</label><input value={form.shop_phone} onChange={e => setForm({...form,shop_phone:e.target.value})} /></div>
      <div className="field"><label>Shop address (appears on PDF)</label><textarea rows="3" value={form.shop_address} onChange={e => setForm({...form,shop_address:e.target.value})} /></div>

    </form>
  </div>;
}

function BillingManager({ products }) {

        sb.from('billing_profiles').select('*').eq('owner_id', owner).maybeSingle()
      ]);
      if (billRes.error) throw billRes.error;
      if (profileRes.error) throw profileRes.error;
      setBills(billRes.data || []);
      setProfile(profileRes.data ? {shop_name:profileRes.data.shop_name,shop_phone:profileRes.data.shop_phone,shop_address:profileRes.data.shop_address} : SHOP_DEFAULTS);
    } catch (e) {
      setError((e.message || 'Could not load bills.') + ' Run the supplied Supabase SQL setup if this is the first time.');
    } finally { setBusy(false); }
  }, []);
  useEffect(() => { reload(); }, [reload]);

  function onSaved(row, warning) {
    setBills(prev => [row, ...prev.filter(x => x.id !== row.id)]);
    setEditingBill(null);
    setMode('list');
    setNotice(warning || ('Bill '+row.invoice_number+' saved to Supabase cloud storage.'));
  }
  async function withBillAction(row, action) {
    // Reserve a tab synchronously on click: otherwise browsers block window.open after an async signing request.
    const shareTab = action === 'whatsapp' ? window.open('about:blank', '_blank') : null;
    setActionId(row.id); setError(''); setNotice('');
    try {
      if (action === 'retry') {
        const owner = await getBillingOwner();
        const repaired = await uploadInvoicePdf(row, owner);
        setBills(prev => prev.map(x => x.id === row.id ? repaired : x));
        setNotice('PDF uploaded successfully.');
      } else if (action === 'download') {
        if (!row.pdf_path) throw new Error('PDF missing. Retry PDF first.');
        const { data, error } = await sb.storage.from(INVOICE_BUCKET).download(row.pdf_path);
        if (error) throw error;
        downloadInvoiceBlob(data, row.invoice_number);
      } else {
        const signed = await invoiceSignedUrl(row);
        const body = `Velan Crackers sales bill ${row.invoice_number}\nAmount: ${invoiceCurrency(row.grand_total)}\nView/download PDF: ${signed}\n\nThis secure link expires in 7 days.`;
        if (action === 'whatsapp') {
          const link = 'https://wa.me/?text='+encodeURIComponent(body);
          if (shareTab && !shareTab.closed) { shareTab.opener = null; shareTab.location.replace(link); }
          else { window.location.href = link; }
          setNotice('WhatsApp opened with a bill message. Press Send in WhatsApp to deliver it.');
        } else if (action === 'email') {
          const mail = `mailto:?subject=${encodeURIComponent('Velan Crackers bill '+row.invoice_number)}&body=${encodeURIComponent(body)}`;
          window.location.href = mail;
          setNotice('Your email app was opened. Send the message there.');
        } else if (action === 'copy') {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(signed);
          } else {
            const temp = document.createElement('textarea');
            temp.value = signed; temp.style.cssText = 'position:fixed;left:-9999px;top:0';
            document.body.appendChild(temp); temp.select();
            if (!document.execCommand('copy')) throw new Error('Automatic copy unavailable; use the WhatsApp or Email option.');
            temp.remove();
          }
          setNotice('Secure 7-day PDF link copied.');
        }
      }
    } catch (e) { if (shareTab && !shareTab.closed) shareTab.close(); setError(e.message || 'Action failed.'); }
    finally { setActionId(null); }
  }
  const displayed = useMemo(() => bills.filter(b => `${b.invoice_number} ${b.invoice_date} ${b.payment_method}`.toLowerCase().includes(search.trim().toLowerCase())), [bills,search]);
  const summary = useMemo(() => ({ count:bills.length, total:roundMoney(bills.reduce((x,b)=>x+Number(b.grand_total),0)), unpaid:roundMoney(bills.filter(b=>b.payment_status==='unpaid').reduce((x,b)=>x+Number(b.grand_total),0)) }), [bills]);

  return <div>
    {error && <div className="modal-error">{error}</div>}
    {notice && <div className="bill-notice" role="status">{notice}</div>}
    {mode === 'create' ? <BillEditor key={editingBill?.id || 'new'} initialBill={editingBill} products={products} profile={profile} onClose={() => {setEditingBill(null);setMode('list');}} onSaved={onSaved} /> :
     mode === 'profile' ? <ProfileEditor profile={profile} onClose={() => setMode('list')} onSaved={p => {setProfile(p);setMode('list');setNotice('Shop details saved to cloud.');}}/> : <>
      <div className="billing-head"><div><h1 className="admin-title">Bills & invoices</h1><p className="admin-sub">Create, edit and download simple sales bills. PDFs are stored privately in Supabase.</p></div>
        <div className="bill-head-buttons"><button className="btn btn-ghost btn-sm" type="button" onClick={() => setMode('profile')}>Shop details</button><button className="btn btn-primary btn-sm" type="button" onClick={() => {setEditingBill(null);setMode('create');}}><PlusIcon /> New bill</button></div></div>
      <div className="bill-stats"><div><span>Bills loaded</span><strong>{summary.count}</strong></div><div><span>Total billed</span><strong>{invoiceCurrency(summary.total)}</strong></div><div><span>Unpaid billed</span><strong>{invoiceCurrency(summary.unpaid)}</strong></div></div>
      <div className="field" style={{marginTop:14}}><label>Find saved bill (most recent 200)</label><input type="search" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search bill number, date, payment method" /></div>
      {busy && <p className="admin-sub">Loading cloud bills…</p>}
      {!busy && displayed.length===0 ? <div className="admin-empty">No bills found. Select <b>New bill</b> to create your first one.</div> :
      <div className="bill-history">{displayed.map(b => <div className="bill-history-item" key={b.id}>
        <div className="bill-history-info"><strong>{b.invoice_number}</strong><div className="admin-sub">{b.invoice_date} · {b.payment_status === 'paid' ? 'Paid' : 'Unpaid'} {b.pdf_path ? '· PDF in cloud' : '· PDF needs upload'}</div></div>
        <div className="bill-history-total">{invoiceCurrency(b.grand_total)}</div>
        <div className="bill-history-actions">
          <button type="button" className="btn btn-ghost btn-sm" disabled={actionId===b.id} onClick={() => {setEditingBill(b);setMode('create');setError('');setNotice('');}}>Edit bill</button>
          {b.pdf_path ? <>
            <button type="button" className="btn btn-primary btn-sm" disabled={actionId===b.id} onClick={() => withBillAction(b,'whatsapp')}>WhatsApp</button>
            <button type="button" className="btn btn-ghost btn-sm" disabled={actionId===b.id} onClick={() => withBillAction(b,'email')}>Email</button>
            <button type="button" className="btn btn-ghost btn-sm" disabled={actionId===b.id} onClick={() => withBillAction(b,'download')}>Download PDF</button>
            <button type="button" className="btn btn-ghost btn-sm" disabled={actionId===b.id} onClick={() => withBillAction(b,'copy')}>Copy link</button>
          </> : <button type="button" className="btn btn-primary btn-sm" disabled={actionId===b.id} onClick={() => withBillAction(b,'retry')}>Retry PDF upload</button>}
        </div>
      </div>)}</div>}
      <div style={{marginTop:12}}><button type="button" className="btn btn-ghost btn-sm" onClick={reload} disabled={busy}>Refresh bills</button></div>
      <p className="admin-sub" style={{marginTop:14}}>For privacy, PDFs are in a private bucket. Shared links expire after 7 days; generate a fresh link whenever you need. Sending via WhatsApp or email requires a final tap in that app.</p>
    </>}
  </div>;
}

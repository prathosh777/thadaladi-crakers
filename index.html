const BLANK_FORM = { name: "", category: "", unit: "", price: "", mrp: "", img: "", details: "" };

function ProductFormModal({ initial, categories, onCancel, onSave }) {
  const [form, setForm] = useState(initial ? { ...BLANK_FORM, ...initial, mrp: initial.mrp || "" } : BLANK_FORM);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [imgFile, setImgFile] = useState(null);
  const [preview, setPreview] = useState("");
  const [useNewCategory, setUseNewCategory] = useState(initial ? !categories.includes(initial.category) : categories.length === 0);
  const firstFieldRef = useRef(null);

  useEffect(() => { if (firstFieldRef.current) firstFieldRef.current.focus(); }, []);
  useEffect(() => {
    if (!imgFile) { setPreview(""); return; }
    const url = URL.createObjectURL(imgFile);
    setPreview(url);
    return () => URL.revokeObjectURL(url);
  }, [imgFile]);

  function update(field, value) { setForm(prev => ({ ...prev, [field]: value })); }

  async function handleSubmit(e) {
    e.preventDefault();
    if (busy) return;
    const name = form.name.trim();
    const category = form.category.trim();
    const unit = form.unit.trim();
    const priceNum = parseFloat(form.price);
    const mrpNum = form.mrp === "" ? null : parseFloat(form.mrp);

    if (!name) { setError("Enter a product name."); return; }
    if (!category) { setError("Enter or choose a category."); return; }
    if (!unit) { setError("Enter a unit, like 'box of 10'."); return; }
    if (isNaN(priceNum) || priceNum <= 0) { setError("Enter a price greater than 0."); return; }
    if (mrpNum !== null && (isNaN(mrpNum) || mrpNum <= priceNum)) { setError("MRP must be greater than the price, or left blank."); return; }

    setBusy(true); setError("");
    try {
      let img = form.img.trim();
      if (imgFile) img = await uploadProductImage(imgFile);
      await onSave({
        id: initial && initial.id ? initial.id : null,
        row: { 
          name, 
          category, 
          unit, 
          price: priceNum, 
          mrp: mrpNum, 
          img: img || PLACEHOLDER_IMG,
          details: form.details.trim() // SAVE DETAILS FIELD
        },
      });
    } catch (err) {
      setError(err.message || "Something went wrong. Try again.");
      setBusy(false);
    }
  }

  const shownImg = preview || form.img;

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pf-title">
      <div className="modal">
        <h2 id="pf-title" className="modal-title">{initial ? "Edit product" : "Add product"}</h2>
        {error && <div className="modal-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="pf-name">Product name</label>
            <input id="pf-name" ref={firstFieldRef} type="text" value={form.name} onChange={(e) => update("name", e.target.value)} placeholder="e.g. Wire Sparklers — 10 inch" />
          </div>

          <div className="field">
            <label htmlFor="pf-category">Category</label>
            {useNewCategory || categories.length === 0 ? (
              <input id="pf-category" type="text" value={form.category} onChange={(e) => update("category", e.target.value)} placeholder="e.g. Sparklers" />
            ) : (
              <select id="pf-category" value={form.category} onChange={(e) => update("category", e.target.value)}>
                <option value="">Choose a category…</option>
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            )}
            {categories.length > 0 && (
              <div className="field-hint">
                <a href="#" onClick={(e) => { e.preventDefault(); setUseNewCategory(v => !v); update("category", ""); }}>
                  {useNewCategory ? "Choose an existing category instead" : "Create a new category instead"}
                </a>
              </div>
            )}
          </div>

          <div className="field-row">
            <div className="field">
              <label htmlFor="pf-unit">Unit</label>
              <input id="pf-unit" type="text" value={form.unit} onChange={(e) => update("unit", e.target.value)} placeholder="e.g. box of 10" />
            </div>
            <div className="field">
              <label htmlFor="pf-price">Price (₹)</label>
              <input id="pf-price" type="number" min="0" step="any" inputMode="decimal" value={form.price} onChange={(e) => update("price", e.target.value)} placeholder="e.g. 150" />
            </div>
          </div>

          <div className="field">
            <label htmlFor="pf-mrp">MRP / strike-through price (optional)</label>
            <input id="pf-mrp" type="number" min="0" step="any" inputMode="decimal" value={form.mrp} onChange={(e) => update("mrp", e.target.value)} placeholder="Leave blank if no discount" />
          </div>

          {/* ADDED DETAILS FIELD FOR GIFT BOX INFO */}
          <div className="field">
            <label htmlFor="pf-details">Details / Contents (optional)</label>
            <textarea id="pf-details" rows="3" value={form.details} onChange={(e) => update("details", e.target.value)} placeholder="e.g. 10 Sparklers, 5 Flower Pots, etc."></textarea>
            <div className="field-hint">Use this for Gift Boxes. Any text typed here will show when a user clicks the "i" button on the storefront.</div>
          </div>

          <div className="field">
            <label htmlFor="pf-file">Photo</label>
            <div className="img-row">
              <img className="img-preview" src={shownImg || PLACEHOLDER_IMG} alt="" onError={(e) => { e.target.style.opacity = "0.25"; }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <input id="pf-file" type="file" accept="image/*" onChange={(e) => setImgFile(e.target.files && e.target.files[0] ? e.target.files[0] : null)} />
                <div className="field-hint">Upload from your phone or computer. It's resized automatically.</div>
              </div>
            </div>
            <input id="pf-img" type="text" style={{ marginTop: 8 }} value={form.img} onChange={(e) => update("img", e.target.value)} placeholder="…or paste an image URL" aria-label="Image URL" />
          </div>

          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : (initial ? "Save changes" : "Add product")}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ConfirmDeleteModal({ product, onCancel, onConfirm }) {

  async function go() {
    setBusy(true); setError("");
    try { await onConfirm(); } catch (e) { setError(e.message || "Delete failed."); setBusy(false); }
  }
  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="cd-title">
      <div className="confirm-box">
        <h2 id="cd-title" className="modal-title">Delete this product?</h2>

        <div className="modal-actions">
          <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={busy}>Cancel</button>

function SettingsModal({ initialNumber, onCancel, onSave }) {
  const [number, setNumber] = useState(initialNumber);
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    const digits = number.replace(/\D/g, "");
    if (digits.length < 8) { setError("Enter a valid WhatsApp number with country code, digits only (e.g. 919876543210)."); return; }
    if (password && password.length < 8) { setError("New password must be at least 8 characters."); return; }
    setBusy(true); setError("");
    try { await onSave(digits, password); }
    catch (err) { setError(err.message || "Could not save settings."); setBusy(false); }
  }

  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="set-title">
      <div className="modal">
        <h2 id="set-title" className="modal-title">Shop settings</h2>
        {error && <div className="modal-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="set-number">WhatsApp number for orders</label>
            <input id="set-number" type="text" inputMode="numeric" value={number} onChange={(e) => setNumber(e.target.value)} placeholder="Country code + number, e.g. 919876543210" />
            <div className="field-hint">Digits only, starting with the country code. No + or spaces needed.</div>
          </div>
          <div className="field">
            <label htmlFor="set-pass">Change admin password (optional)</label>
            <input id="set-pass" type="password" autoComplete="new-password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Leave blank to keep the current one" />
          </div>
          <div className="field-hint" style={{ marginBottom: "14px" }}>Tap the shop name 5 times on the main page to reach the admin login again.</div>
          <div className="modal-actions">
            <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : "Save settings"}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

          <button type="button" className={"admin-tab"+(adminSection === "billing" ? " active" : "")} onClick={() => setAdminSection("billing")}>Bills &amp; Invoices</button>
        </nav>
        {adminSection === "billing" ? <BillingManager products={products} /> : <>
        <h1 className="admin-title">Manage products</h1>
        <p className="admin-sub">Signed in as {userEmail}. Changes show in the shop for every customer immediately.</p>

        <div className="admin-toolbar">
          <select className="plain-select" value={filterCat} onChange={(e) => setFilterCat(e.target.value)} aria-label="Filter by category">
            <option value="All">All categories ({products.length})</option>
            {categories.map(c => <option key={c} value={c}>{c} ({products.filter(p => p.category === c).length})</option>)}
          </select>
          <button type="button" className="btn btn-primary btn-add-desktop" onClick={() => setEditing({})}>
            <PlusIcon /> Add product
          </button>
        </div>

        {visible.length === 0 ? (
          <div className="admin-empty">
            <div style={{ fontSize: "16px", color: "var(--ink)", marginBottom: "6px", fontWeight: 600 }}>No products here</div>
            <div style={{ marginBottom: "16px" }}>Add a cracker to get the shop started.</div>
            <button type="button" className="btn btn-primary" onClick={() => setEditing({})}>Add product</button>
          </div>
        ) : (
          <div className="admin-list">
            {visible.map(product => (
              <div className="admin-item" key={product.id}>
                <div className="admin-item-top">
                  <img className="admin-thumb" src={product.img} alt="" onError={(e) => { e.target.style.opacity = "0.2"; }} />
                  <div className="admin-item-info">
                    <div className="admin-item-name">{product.name}</div>
                    <div className="admin-item-meta">
                      <span className="cat-badge">{product.category}</span>
                      <span>{product.unit}</span>
                      {/* Show an indicator in admin if details exist */}
                      {product.details && <span style={{ color: 'var(--accent)', fontWeight: 600 }}>ℹ️ Details added</span>}
                    </div>
                    <div className="admin-item-price">
                      <strong>{formatRupees(product.price)}</strong>
                      {product.mrp && <span className="card-mrp">{formatRupees(product.mrp)}</span>}
                    </div>
                  </div>
                </div>
                <div className="admin-item-actions">
                  <button type="button" className="btn btn-ghost btn-sm" onClick={() => setEditing(product)}>Edit</button>
                  <button type="button" className="btn btn-danger btn-sm" onClick={() => setDeleting(product)}>Delete</button>
                </div>
              </div>
            ))}
          </div>
        )}
        </>}
      </main>

      {adminSection === "products" && <button type="button" className="btn btn-primary admin-fab" onClick={() => setEditing({})} aria-label="Add product">
        <PlusIcon /> Add product
      </button>}

      {editing !== null && (
        <ProductFormModal initial={editing.id ? editing : null} categories={categories} onCancel={() => setEditing(null)} onSave={handleSave} />
      )}
      {deleting && (
        <ConfirmDeleteModal product={deleting} onCancel={() => setDeleting(null)} onConfirm={() => handleDelete(deleting)} />
      )}
      {showSettings && (
        <SettingsModal initialNumber={whatsapp} onCancel={() => setShowSettings(false)} onSave={handleSaveSettings} />
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function App() {
  const [view, setView] = useState("shop"); // "shop" | "login" | "admin"
  const [products, setProducts] = useState(loadCachedProducts);
  const [whatsapp, setWhatsapp] = useState(() => safeGet(CACHE_WA_KEY, DEFAULT_WHATSAPP_NUMBER));
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [session, setSession] = useState(null);
  const [theme, cycleTheme] = useTheme();

  const refresh = useCallback(async () => {
    if (!sb) {
      setLoadError("The shop database isn't connected yet. Add the Supabase URL and key in index.html.");
      setLoading(false);
      return;
    }
    try {
      const [list, wa] = await Promise.all([fetchProducts(), fetchWhatsApp()]);
      setProducts(list);
      setWhatsapp(wa);
      setLoadError("");
      safeSet(CACHE_PRODUCTS_KEY, JSON.stringify(list));
      safeSet(CACHE_WA_KEY, wa);
    } catch (e) {
      console.error(e);
      setLoadError("Check your internet connection and try again.");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    refresh();
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, [refresh]);

  // Pick up changes made elsewhere when the customer returns to the tab
  useEffect(() => {
    function onVisible() { if (document.visibilityState === "visible") refresh(); }
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [refresh]);

  // If the session ends while in admin, drop back to the shop
  useEffect(() => { if (view === "admin" && !session) setView("shop"); }, [session, view]);

  function openAdmin() { setView(session ? "admin" : "login"); }
  async function signOut() { if (sb) await sb.auth.signOut(); setView("shop"); }

  if (view === "login") {
    return <LoginGate onSuccess={() => setView("admin")} onCancel={() => setView("shop")} />;
  }
  if (view === "admin" && session) {
    return (
      <Admin
        products={products}
        whatsapp={whatsapp}
        userEmail={session.user.email}
        theme={theme}
        onCycleTheme={cycleTheme}
        onBack={() => setView("shop")}
        onRefresh={refresh}
        onWhatsAppSaved={(n) => { setWhatsapp(n); safeSet(CACHE_WA_KEY, n); }}
        onSignOut={signOut}
      />
    );
  }
  return (
    <Storefront
      products={products}
      whatsapp={whatsapp}
      loading={loading}
      loadError={loadError}
      onRetry={() => { setLoading(true); refresh(); }}
      theme={theme}
      onCycleTheme={cycleTheme}
      onOpenAdminGate={openAdmin}
    />
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
